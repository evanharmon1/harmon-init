# .devflow.toml — the portable rigor/strategy execution-policy vocabulary for
# the Dev Loop (AGENTS.md). `rigor` is how much confidence, effort, depth,
# and budget a change gets; `strategy` is how the work is organized and
# performed. Both are durable, advisory GitHub-label-shaped choices
# (rigor:*/strategy:*) that arm nothing by existing — see "Nothing here arms
# anything" below.
#
# This file is the numbers; docs/guides/devflow.md is the model, the worked
# resolution examples, the natural-language interface, and the registry/
# Foreman ownership boundaries — it links back here rather than restating
# values. Rationale specific to one setting lives as a comment beside that
# setting. ADR 0007 (docs/decisions/0007-rigor-and-strategy-axes.md) records
# the design decisions and their "not" reasoning; it supersedes ADR 0006 D4
# (the old method-rank model) and amends D5 (resolution order, restated below
# for strategy). `[tier.*]` at the bottom of this file is unchanged from the
# model ADR 0006 introduced.
#
# Two top-level defaults, nothing else:
default_rigor    = "standard"
default_strategy = "plan"

# Weakest → strongest. This is the ONLY place "strongest" is defined for
# rigor: two rigor:* labels on the same issue resolve to whichever sorts
# later here. Unlike the strategy axis (conflicts are ambiguous — see
# [strategy.*] below) or the old [method].rank this file used to carry (an
# ADR-fixed exact sequence, pinned because method conflicts needed one
# global cross-consumer answer regardless of any single repo's opinion),
# rigor_order is a RETUNABLE value: the validator only requires it to be a
# permutation of the [rigor.*] keys below, not this exact sequence. A
# consumer who adds a custom level slots it in wherever it belongs on their
# own continuum.
rigor_order = ["trivial", "minimal", "light", "standard", "thorough", "deep"]

# ── Resolution order (docs/guides/devflow.md has the worked examples) ──────
#
#   explicit operator instruction (attributable channel only — an
#   interactive session's human input, or an automation's own trusted
#   config; NEVER issue/PR text, which is untrusted repository content)
#     > rigor:*/strategy:* labels on the issue
#       > default_rigor / default_strategy above
#         > the built-in fallback (the `standard` review policy: 3 / 3 / 4,
#           min_rounds 1), strategy `plan`, tiers inert — used only when
#           this file is entirely absent
#
# Advanced overrides — tier:<role>:<value>, or an unqualified tier:<value>
# (which targets the IMPLEMENTER only; see [tier.*] below) — REFINE the
# selected rigor/strategy profile. Absent an override, every lower-level
# value (review caps, all three role tiers, budget, strategy fields) comes
# from the resolved rigor and strategy alone.
#
# Rigor conflicts resolve to the strongest label present, by rigor_order
# above — a conflict can only ever buy more depth and budget. Strategy
# conflicts are AMBIGUOUS: there is no rank, because unlike rigor's
# more-or-less continuum, two topologies are not orderable against each
# other. An interactive resolver asks; unattended automation falls back to
# default_strategy with a warning rather than silently picking among the
# candidates.
#
# Off-default resolution — above OR below default_rigor/default_strategy, or
# a role tier that ends up off the rigor's own profile for that role — is
# disclosed in the PR body (the harmon-init rigor doctrine, unchanged).
# Unattended automation additionally requires label provenance before
# acting on any of it (ADR 0006 D6, unchanged).
#
# Merge-base rule: when the change under review edits THIS FILE, every
# parameter above is read from the merge-base copy, not the branch copy —
# otherwise a branch could lower the very gate it is changing. An explicit
# human instruction still overrides.
#
# Nothing here arms anything. rigor:*/strategy:* never invoke a model or
# start a workflow by existing; foreman:* remains the sole arming surface,
# and .foreman.toml remains authoritative for arming, trusted actors,
# runner/backend selection, authentication, billing mode, and hard
# operational ceilings — Foreman intersects a resolved budget envelope with
# its own ceilings rather than trusting either source alone (Foreman-side
# work, out of scope for this file).
#
# Announcement line on entering the Dev Loop (worked example — fill in the
# values actually resolved, don't hand-copy this one):
#   rigor: standard (default) → review standard: challenge ≤3, review ≤3,
#   shepherd 4, min_rounds 1 · tiers orch/impl/rev = frontier/standard/
#   frontier · budget standard · strategy: plan (default)

# ── Rigor levels — depth/effort/budget ──────────────────────────────────────
#
# Each level names a [review.*] policy, three ROLE-specific tiers (not one
# shared tier — the orchestrator planning the work, the implementer writing
# it, and the reviewer checking it are different jobs with different minimum
# capability needs), a [budget.*] envelope, and the `description` that
# becomes the `rigor:<level>` label's text in label-registry.json (kept
# equal to it there — test:devflow-config is the drift gate; ≤100 chars).
#
# Two invariants hold for every level below: orchestrator_tier >=
# implementer_tier, and reviewer_tier >= implementer_tier (ladder order,
# [tier.*] far below — minima, not maxima: a role may cost MORE than its
# floor, never less without disclosure). reviewer_tier is a FLOOR for
# whichever harness ends up reviewing, not a global quality ranking of
# review products — a review harness is the executable mechanism
# (agent-registry.json `roles`), and family diversity (prefer a reviewer
# from a different model family than the implementer, same-family only with
# disclosure) is a separate, independence-driven preference layered on top;
# see docs/guides/devflow.md for the full split. An explicit, attributable
# operator override MAY violate either invariant (spend less on a role than
# the level implies) but is recorded and disclosed as an off-profile
# decision rather than silently accepted; the shipped levels below never do,
# and a mutation that breaks either invariant here is rejected.
[rigor.trivial]
review             = "none"
orchestrator_tier  = "economy"
implementer_tier   = "economy"
reviewer_tier      = "economy"
budget             = "trivial"
description        = "Rigor: no AI review, economy tiers throughout, smallest budget — near-zero-risk changes"

[rigor.minimal]
review             = "driveby"
orchestrator_tier  = "standard"
implementer_tier   = "economy"
reviewer_tier      = "standard"
budget             = "light"
description        = "Rigor: a quick driveby review, standard orchestrator/reviewer, economy implementer, light budget"

[rigor.light]
review             = "light"
orchestrator_tier  = "frontier"
implementer_tier   = "economy"
reviewer_tier      = "frontier"
budget             = "light"
description        = "Rigor: light review, frontier orchestrator/reviewer, economy implementer, light budget"

# The default for ordinary changes.
[rigor.standard]
review             = "standard"
orchestrator_tier  = "frontier"
implementer_tier   = "standard"
reviewer_tier      = "frontier"
budget             = "standard"
description        = "Rigor: standard review, frontier orchestrator/reviewer, standard implementer — the default"

[rigor.thorough]
review             = "thorough"
orchestrator_tier  = "apex"
implementer_tier   = "standard"
reviewer_tier      = "apex"
budget             = "thorough"
description        = "Rigor: thorough review, apex orchestrator/reviewer, standard implementer, thorough budget"

# Security, migrations, data paths — anything with an irreversible failure mode.
[rigor.deep]
review             = "deep"
orchestrator_tier  = "apex"
implementer_tier   = "frontier"
reviewer_tier      = "apex"
budget             = "deep"
description        = "Rigor: deep review, apex orchestrator/reviewer, frontier implementer, deep budget"

# ── Review policies — challenge/review/shepherd round-cap ceilings ─────────
#
# `challenge`, `review`, and `shepherd` are per-stage MAXIMUM heuristic
# passes (Dev Loop stage caps, AGENTS.md); `min_rounds` is the minimum
# passes an enabled stage must actually run before it may take the early
# clean-round exit (two consecutive adjudicated-clean rounds always exits
# regardless of min_rounds; a single round with no findings at all needs
# min_rounds satisfied first). A cap of 0 disables that heuristic stage
# outright — the deterministic gates (tests, CI, security scanners, branch
# protection, human merge/release approval) and the obligation to adjudicate
# and record any finding that DOES surface are unchanged by a disabled
# stage; a cap of 1 is a single pass, ending the stage the moment that round
# is clean.
#
# `min_rounds` is scoped to `challenge` and `review` ONLY —
# `0 <= min_rounds <= min(challenge, review)`. `shepherd` never bounds it:
# shepherd is externally driven (CI results, human review, Codex) rather
# than something the agent paces itself, so it cannot MANUFACTURE a round
# the way a self-generated challenge/review pass can — there is no sense in
# which shepherd could satisfy a "run at least N of your own rounds first"
# floor, since its rounds are not the agent's to run on demand. When both
# challenge and review are capped at 0 (`none`), min_rounds is forced to 0
# right along with them, which is exactly the `none` row below, not a bug
# to reject.
#
# Unlike the rigor-scoped caps this table replaces, `shepherd` now varies
# WITH the policy (1 through 6) instead of holding one repo-wide value
# regardless of depth: shepherd bounds other people's findings (CI, human
# review, Codex), and a shallower rigor level legitimately expects to answer
# fewer of them before promoting — not zero at every level regardless of the
# chosen depth, and not a fixed number that ignores how much review was
# actually requested.
[review.none]
challenge  = 0
review     = 0
shepherd   = 0
min_rounds = 0

[review.driveby]
challenge  = 1
review     = 1
shepherd   = 1
min_rounds = 1

[review.light]
challenge  = 2
review     = 2
shepherd   = 3
min_rounds = 1

[review.standard]
challenge  = 3
review     = 3
shepherd   = 4
min_rounds = 1

[review.thorough]
challenge  = 4
review     = 4
shepherd   = 5
min_rounds = 1

[review.deep]
challenge  = 5
review     = 5
shepherd   = 6
min_rounds = 1

# ── Budget envelopes — portable resource ceilings ───────────────────────────
#
# max_agent_runs and max_parallel_agents bound the ORCHESTRATION/
# IMPLEMENTATION work itself — the orchestrator's own invocation plus every
# worker or implementer run a strategy's topology spawns (e.g. orchestrate's
# lead + workers, council's independent proposers). They do NOT count
# challenge/review/shepherd passes: those are a separate cost axis, already
# bounded by the resolved [review.*] policy's own caps (challenge/review/
# shepherd/min_rounds, above) — a rigor level's budget and its review policy
# are two independent envelopes, not one shared pool, so a clean run's
# required review passes are never in tension with how many agents the work
# itself was allowed to spend. wall_clock_min bounds elapsed time;
# allow_tier_escalation says whether a role may climb its tier's
# escalate_to chain ([tier.*] below) under this budget at all. Optional
# max_tokens / max_usd are part of the schema but ABSENT from every shipped
# envelope below: a consumer that cannot actually measure tokens or spend
# must report the corresponding limit as UNENFORCED rather than claiming an
# enforcement it cannot perform — do not add either key here unless
# harmon-init itself gains that measurement.
#
# Only five envelopes for six rigor levels: `minimal` reuses `light`'s
# envelope (its extra caution over `trivial` is entirely in the review
# policy and tiers, not the budget).
#
# Foreman intersects a resolved envelope with its own hard ceilings
# (.foreman.toml) rather than trusting either source alone; that
# intersection is Foreman-side work, out of scope for this file.
[budget.trivial]
max_agent_runs        = 1
max_parallel_agents   = 1
wall_clock_min        = 15
allow_tier_escalation = false

[budget.light]
max_agent_runs        = 3
max_parallel_agents   = 2
wall_clock_min        = 45
allow_tier_escalation = false

[budget.standard]
max_agent_runs        = 6
max_parallel_agents   = 3
wall_clock_min        = 120
allow_tier_escalation = true

[budget.thorough]
max_agent_runs        = 12
max_parallel_agents   = 4
wall_clock_min        = 240
allow_tier_escalation = true

[budget.deep]
max_agent_runs        = 20
max_parallel_agents   = 4
wall_clock_min        = 480
allow_tier_escalation = true

# ── Strategies — how the work is organized and performed ───────────────────
#
# topology: the structural arrangement of agents — precisely, not just by
#   name:
#     single-agent        one ACCOUNTABLE lead that may use bounded helper
#                          subagents ONLY when delegation permits it
#                          (delegation = "optional"); the helpers are not
#                          first-class units of the topology, just the one
#                          lead's own implementation detail.
#     lead-and-workers     workers ARE first-class units the lead's plan
#                          depends on, not an implementation detail — so
#                          delegation is REQUIRED, never merely available.
#     independent-proposals   council: a coordinator DELEGATES each proposal
#                          as its own first-class unit of work, >= 2
#                          proposers execute independently, then the
#                          coordinator judges (see selection/synthesis/
#                          min_agents below). Nobody plans FOR the
#                          proposers — each plans its own proposal
#                          (planning = "independent") — but dispatching the
#                          work is still delegation in the ordinary sense;
#                          "coordinator" is this topology's name for the
#                          delegating party, exactly as "lead" is
#                          lead-and-workers' name for it. delegation =
#                          "required" needs no special-casing here.
#     human-directed       human-led: the human is the accountable party: a
#                          topology in its own right, not a variant of
#                          single-agent with a human standing in as the lead.
# planning: whether/how a plan is produced before work starts (inline =
#   folded into the first turn, explicit = a stated plan, independent = each
#   proposal plans on its own before comparison, collaborative = produced
#   together with the human).
# delegation: whether the lead may (optional) or must (required) assign
#   bounded work to other agents, or never does (none). Constrained by
#   topology, not independently free: single-agent forbids `required` (an
#   accountable lead cannot be MANDATED to delegate away its own work — that
#   would make it lead-and-workers under a different name); lead-and-workers
#   AND independent-proposals both require `required` (workers, and
#   proposals alike, are first-class dispatched units, not optional help);
#   `none` is legal ONLY under single-agent (every other topology inherently
#   involves more than the one accountable party, so "no delegation at all"
#   cannot describe it). The validator enforces this triangle.
# coordination: scheduling/independence policy among delegated agents (only
#   `orchestrate` sets it today: parallel-when-independent).
# selection / synthesis: council-only. `selection = "judge"` compares
#   independent proposals against the actual requirements — a judged
#   comparison, not a vote. `synthesis = true` permits combining compatible
#   strengths from more than one proposal rather than picking exactly one
#   verbatim.
# min_agents: the floor that keeps a run from being represented as a
#   topology it cannot actually be — but it COUNTS DIFFERENTLY per topology,
#   because the accountable party is counted differently:
#     independent-proposals (council)  PROPOSERS only, >= 2 — the
#       coordinator that dispatches each proposal and later judges them is
#       NOT one of the min_agents; it is an ADDITIONAL run (see the budget
#       formula below).
#     lead-and-workers (orchestrate)   the lead PLUS its workers, >= 2 —
#       delegation = "required" means a lead PLUS at least one worker, so a
#       single-agent run is not orchestration either, just oneshot/plan
#       wearing a different label. Unlike council, the lead IS counted.
# human_gates: pause points this strategy inserts, drawn from the allowed
#   set below. This is the ONLY configurable human-gate vocabulary —
#   constitutional approvals (merge, release, destructive actions,
#   credential-store writes, security-relevant settings) are never in this
#   list and can never be disabled or reconfigured by a strategy; they are
#   enforced independently of rigor/strategy entirely (AGENTS.md hard rules,
#   branch protection, CODEOWNERS) and a strategy naming one is a validation
#   error, not a stricter gate.
#   allowed: after-discovery, after-plan, before-delegation, before-
#   selection, before-synthesis, before-scope-expansion, before-budget-
#   escalation, before-publication, before-ready-for-review, each-phase.
# description: becomes the `strategy:<name>` label's text in
#   label-registry.json (kept equal to it there; ≤100 chars).
#
# A strategy whose min_agents needs more than the resolved rigor's budget
# provides is INCOMPATIBLE, and resolution reports that rather than
# silently substituting a different topology. What "more than the budget
# provides" means is topology-specific ONLY for council — every topology is
# checked against BOTH ceilings directly, with no subtraction or addition
# on either one, except where noted:
#   independent-proposals (council)   needs max_parallel_agents >=
#     min_agents (the proposers run concurrently) AND max_agent_runs >=
#     min_agents + 1 (the coordinator's judging pass is one more run, after
#     the proposers finish, so it does not need a concurrent slot but DOES
#     count toward the total).
#   lead-and-workers (orchestrate)    needs max_agent_runs >= min_agents
#     AND max_parallel_agents >= min_agents — plainly, no "+1" the way
#     council needs and no "-1" for the lead either: min_agents already
#     counts the lead PLUS its workers (the WHOLE minimum roster), and
#     specs/issue-strategy.md states this as the general rule with no
#     per-topology discount, so orchestrate does not special-case away
#     from it the way council's different COUNTING convention does.
# e.g. council OR orchestrate under trivial (budget.trivial: 1 and 1, above)
# — trivial's whole point is a single agent doing a single pass, which
# neither topology can honestly represent, by either formula.
# Every shipped strategy×rigor pair either resolves cleanly or is one of
# these documented incompatibilities (scripts/test-devflow-config.sh carries
# the executable list, checked in both directions: an undocumented
# incompatible pair fails it, and so does a documented one that no longer
# actually is); a pairing that starts resolving cleanly again after a retune
# is expected to be removed from that list, not left stale.
[strategy.oneshot]
topology    = "single-agent"
planning    = "inline"
delegation  = "none"
human_gates = []
description = "Strategy: single agent, no separate plan phase"

[strategy.plan]
topology    = "single-agent"
planning    = "explicit"
delegation  = "optional"
human_gates = []
description = "Strategy: agent plans then implements; no human plan gate"

[strategy.plan-approved]
topology    = "single-agent"
planning    = "explicit"
delegation  = "optional"
human_gates = ["after-plan"]
description = "Strategy: plan requires human approval before implementation"

[strategy.orchestrate]
topology     = "lead-and-workers"
planning     = "explicit"
delegation   = "required"
coordination = "parallel-when-independent"
min_agents   = 2
human_gates  = []
description  = "Strategy: lead agent delegates bounded work to parallel workers"

[strategy.council]
topology    = "independent-proposals"
planning    = "independent"
delegation  = "required"
selection   = "judge"
synthesis   = true
min_agents  = 2
human_gates = []
description = "Strategy: independent proposals, judged; best or synthesis wins (2+ agents)"

[strategy.human-led]
topology    = "human-directed"
planning    = "collaborative"
delegation  = "optional"
human_gates = ["after-discovery", "after-plan", "before-publication"]
description = "Strategy: human owns central decisions; AI does bounded pieces"

# ─────────────────────────────────────────────────────────────────────────────
# Model tiers — which stratum works a role. Added under harmon-init#855, per
# ADR 0006; re-scoped to per-role resolution under harmon-init#1047, per
# ADR 0007. This config is self-contained: the ADRs (recorded in the
# harmon-init repository) hold the rationale a consumer does not need to
# resolve the axis.
#
# There is no top-level `default_tier` here: the default for all three roles
# (orchestrator/implementer/reviewer) is whatever the resolved [rigor.*]
# level's *_tier fields say, above. An unqualified `tier:<value>` label or
# override REFINES that profile for the IMPLEMENTER role only — it is the
# common case (a human usually means "make the implementer cheaper/stronger"
# when they say just "tier"). `tier:orchestrator:<value>` /
# `tier:implementer:<value>` / `tier:reviewer:<value>` refine one named role
# explicitly. Neither form is a new top-level default; absent any override,
# every role comes from the rigor profile alone.
#
# `tier:adaptive` (unscoped, or scoped to a role) is a VALID refinement
# value — never "unknown" — even though `[rigor.*]` role tiers themselves
# must stay concrete (below): a human or a label may legitimately ask for a
# role to be classified by preflight rather than pinned. A concrete tier
# label for the same role still beats `adaptive` (ADR 0006 D5 — a conflict
# only ever buys more capability, and `adaptive` isn't a capability level to
# compare against). Resolving `adaptive` needs a concrete answer from
# somewhere: the resolver's `--adaptive-result` represents that answer when
# a caller's own preflight step has already run; absent it, the role
# reports needing preflight and provisionally uses the rigor profile's own
# tier rather than guessing.
#
# These tables are INERT ROUTING PREFERENCES, never dependencies (ADR 0006
# D1): a generated repo invokes no model and runs no workflow because a
# table exists, and an acting consumer may select only among vendors and
# harnesses the operator has already configured and authenticated. The
# shipped defaults create no account, trial, or paid-SaaS dependency, and
# escalation can never switch a repo to a vendor it does not already use.
#
# The model slugs below are agent-registry.json family→model slugs.
# harmon-init validates this file at release time with
# scripts/test-devflow-config.sh (a root-only guard with no template
# counterpart — a generated repo carries this config but not the script):
# every slug resolves against the registry, every [rigor.*] *_tier value
# names a table below (never `adaptive`), escalate_to is
# referential/acyclic/monotonic toward `apex` (and `local` → `economy`), and
# a [tier.local] entry binds to a registered `-local` harness. A consumer
# editing these tables owns them the way it owns its AGENTS.md, and re-runs
# that check only if it vendors the script itself.
#
# The tier ladder is `local → economy → standard → frontier → apex` (ADR
# 0006 D2); `adaptive` is off-ladder and never a concrete map, and never a
# legal value for a [rigor.*] role tier — the SHIPPED profile always names a
# concrete rung. `adaptive` IS legal as a label/override refinement value
# (above) — that role then resolves via preflight rather than the profile
# directly, but the profile itself never leaves a role unresolved by
# default. `frontier` is opus-class, `apex` is
# mythos-class (fable, sol). Families appear at a tier only where they have
# a model of that stratum — the top strata are genuinely narrow, so most
# families top out at `standard`. `escalate_to` climbs toward `apex` and
# fires on failure, refusal, or operator policy — never cost alone (ADR 0006
# D3); an exhausted chain stops with a report rather than switching vendor
# or downgrading. `allow_tier_escalation` in the resolved [budget.*] gates
# whether escalation may fire at all.

# Self-hosted stratum. Opt-in per family: an entry must bind to a registered
# `-local` endpoint-variant harness (ADR 0005 D9), and today only
# claude-code-qwen-local (family qwen) is registered — so `local` is qwen-only
# until more are added. `tier:local` escalates to `economy` (ADR 0006 D2).
[tier.local]
endpoint    = "local"
escalate_to = ["economy"]
qwen        = "coder-30b"   # served locally by claude-code-qwen-local

[tier.economy]
escalate_to = ["standard"]
claude   = "haiku"
gpt      = "luna"
gemini   = "3-5-flash-lite"
qwen     = "coder"
deepseek = "v4-flash"
glm      = "4-7-flash"
mai      = "code-1-flash"

[tier.standard]
escalate_to = ["frontier"]
claude   = "sonnet"
gpt      = "terra"
gemini   = "3-6-flash"
qwen     = "coder-plus"
deepseek = "v4-pro"
glm      = "5-2"
mai      = "thinking-1"
kimi     = "k3"
minimax  = "m3"
mistral  = "devstral-small-2"

# Opus-class. Narrow by design — few families ship a model at this stratum.
[tier.frontier]
escalate_to = ["apex"]
claude = "opus"
gemini = "3-1-pro"
qwen   = "max"

# Mythos-class (fable, sol) — the top of the ladder, so escalate_to is empty.
[tier.apex]
escalate_to = []
claude = "fable"
gpt    = "sol"
