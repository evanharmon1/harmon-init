name: Feature
description: Suggest a new capability or improvement
assignees:
  - evanharmon1
labels:
  - feature
  - needs-triage
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve? (e.g. "I'm frustrated when …")
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What you'd like to happen.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: >-
        Optional. One `- [ ]` item per criterion, tagged `[CI]`/`[HUMAN]`;
        triage adds them if blank. Human-only steps go on the
        `(HUMAN):`/`(QA):` collector, not here, unless this is one.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
