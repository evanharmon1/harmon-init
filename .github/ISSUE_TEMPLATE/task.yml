name: Task
description: General work — maintenance, chores, cleanup, or a small improvement
assignees:
  - evanharmon1
labels:
  - task
  - needs-triage
body:
  - type: textarea
    id: description
    attributes:
      label: Problem
      description: Briefly describe the task and the outcome it should achieve.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: >-
        Optional. One `- [ ]` item per criterion, tagged `[CI]`/`[HUMAN]`;
        triage adds them if blank. Human-only steps go on the
        `(HUMAN):`/`(QA):` collector, not here, unless this is one.
  - type: textarea
    id: context
    attributes:
      label: Additional context
