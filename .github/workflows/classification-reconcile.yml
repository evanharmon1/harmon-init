name: Classification Reconcile
run-name: >-
  ${{ inputs.issue > 0 && format('reconciling the classification of issue #{0}', inputs.issue) || 'reconciling the classification of open issues' }}

# Materializes the derived Tier (`tier:<value>`) and `needs-triage` on open
# issues (ADR 2026-09-30 D4 "Reconcile drift" and D6; the Tier is a label on
# every owner type, ADR 2026-10-01). The logic is
# scripts/classification-reconcile.mjs; this file only wires triggers to it.
#
# Three ways in:
#   - schedule: daily on a personal-account repository, monthly on an
#     organization repository (Team-plan minutes are shared and most org
#     repositories are private). Walks this repository's open issues.
#   - workflow_call: classification-event.yml calls it for one issue. An
#     organization-level caller may also pass `repositories`, the
#     CLASSIFICATION_TOKEN secret (a one-hour CI GitHub App installation token)
#     and `use-token: true` to walk every repository in the organization daily
#     — the opt-in path in docs/architecture/ci-cd.md. Without them the walk is
#     limited to the calling repository, because GITHUB_TOKEN is
#     repository-scoped. `use-token` exists only under workflow_call, so on
#     schedule and workflow_dispatch the token is always GITHUB_TOKEN, whatever
#     secrets the repository or organization holds (ruling 9: no stored token).
#   - workflow_dispatch: by hand, with an optional dry run.
#
# Where the code comes from. A run of this repository's own copy (schedule,
# workflow_dispatch, or its own classification-event.yml) checks out this
# repository as it always has, and the script, the reader and this
# repository's registry and policy all come from that checkout. A call from
# ANOTHER repository (an `<org>/.github` caller, which carries no script)
# checks out the repository and commit that own this workflow file instead:
# GitHub sets them as job.workflow_repository and job.workflow_sha from the
# caller's `uses:` reference, where github.repository and github.sha describe
# the caller (docs.github.com/en/actions/reference/workflows-and-actions/contexts#job-context;
# changelog 2026-09-03). No input or secret can point them anywhere else, so
# the code that runs with CLASSIFICATION_TOKEN is the code the caller chose to
# call. That checkout passes no token (the run's own GITHUB_TOKEN, so the
# owning repository must be one it can read, a public one) and persists none.
# Where GitHub leaves them empty (GHES) the run takes the own-copy path.
# They are read through fromJSON(toJSON(job)) only because actionlint does not
# know them yet (rhysd/actionlint#705); the values are the same.
#
# Each walked repository is judged by its own label-registry.json and
# .devflow.toml: the calling repository's from its own-copy checkout, any
# other's read from its default branch (so a wide walk's token also needs
# contents: read on the targets). In a cross-repository call the checkout is
# not the caller's, so RECONCILE_CALLER_CHECKOUT=false sends the caller, when
# walked, through the contents API too, and the script refuses such a call
# that passes no `repositories`: the caller is walked only when it is listed.
#
# Writers: only `tier:<value>` and `needs-triage`, never over `tier:pinned`.
# Loop safety: label writes made with GITHUB_TOKEN start no workflow runs, and
# classification-event.yml never treats `tier:*` or `needs-triage` as an input.

on:
  schedule:
    # Daily: a personal-account repository (public repositories run free).
    - cron: "37 6 * * *"
  workflow_dispatch:
    inputs:
      repositories:
        description: "owner/name list to walk (default: this repository)"
        type: string
        required: false
        default: ""
      issue:
        description: "One issue number to reconcile (0 = every open issue)"
        type: number
        required: false
        default: 0
      dry-run:
        description: "Report the plan without writing any label"
        type: boolean
        required: false
        default: false
  workflow_call:
    inputs:
      repositories:
        description: "owner/name list to walk (default: the calling repository; required when called from another repository); needs the CLASSIFICATION_TOKEN secret beyond it"
        type: string
        required: false
        default: ""
      issue:
        description: "One issue number to reconcile (0 = every open issue)"
        type: number
        required: false
        default: 0
      dry-run:
        description: "Report the plan without writing any label"
        type: boolean
        required: false
        default: false
      use-token:
        description: "Use the CLASSIFICATION_TOKEN secret instead of GITHUB_TOKEN (workflow_call only)"
        type: boolean
        required: false
        default: false
    secrets:
      CLASSIFICATION_TOKEN:
        description: "Optional cross-repository token (a CI GitHub App installation token with Issues: write); defaults to GITHUB_TOKEN"
        required: false

permissions:
  contents: read
  issues: write # tier:<value> and needs-triage labels only

jobs:
  reconcile:
    # Runner switch: CI_RUNS_ON repo/org variable unset -> the rendered
    # default; set it to a JSON runner spec to override without a commit.
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 10
    steps:
      # The two checkouts are exclusive: own copy, or called from another
      # repository (see "Where the code comes from" above).
      - name: Check out this repository
        if: ${{ !(fromJSON(toJSON(job)).workflow_repository && fromJSON(toJSON(job)).workflow_sha && fromJSON(toJSON(job)).workflow_repository != github.repository) }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out the repository that owns this workflow
        if: ${{ fromJSON(toJSON(job)).workflow_repository && fromJSON(toJSON(job)).workflow_sha && fromJSON(toJSON(job)).workflow_repository != github.repository }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ fromJSON(toJSON(job)).workflow_repository }}
          ref: ${{ fromJSON(toJSON(job)).workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # renovate: datasource=node-version depName=node
          node-version: "24"
      - name: Reconcile Tier and needs-triage
        env:
          GH_TOKEN: ${{ inputs.use-token && secrets.CLASSIFICATION_TOKEN || github.token }}
          RECONCILE_REPOSITORIES: ${{ inputs.repositories }}
          RECONCILE_ISSUE: ${{ inputs.issue }}
          RECONCILE_DRY_RUN: ${{ inputs.dry-run }}
          RECONCILE_CALLER_CHECKOUT: ${{ !(fromJSON(toJSON(job)).workflow_repository && fromJSON(toJSON(job)).workflow_sha && fromJSON(toJSON(job)).workflow_repository != github.repository) }}
        run: node scripts/classification-reconcile.mjs
