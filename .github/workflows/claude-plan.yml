name: Claude Plan
run-name: ${{ github.actor }} is running Claude Plan
# Requires: CLAUDE_CODE_OAUTH_TOKEN secret, plus the CI GitHub App
# (CI_APP_CLIENT_ID variable + CI_APP_PRIVATE_KEY secret). See docs/CHECKLIST.md
# and docs/architecture/security.md.
# Mention-only: an explicit `@claude plan` comment or review from an
# authorized sender is the ONLY way this workflow starts work. There is no
# label trigger and no `issues: [opened, assigned]` trigger — a label or an
# assignment carries no actor the sender allowlist can check on every path.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
jobs:
  plan:
    # Authorized senders — an explicit allowlist (claude_authorized_members),
    # not org membership. The `if:` gate and the Verify step below both derive
    # from this list, so they stay in sync.
    if: >-
      (github.event.sender.login == 'evanharmon1') &&
      (contains(github.event.comment.body, '@claude plan') ||
       contains(github.event.review.body, '@claude plan'))
    # Runner switch: CI_RUNS_ON repo/org variable unset -> the rendered
    # default; set it to a JSON runner spec to override without a commit.
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 120
    permissions:
      contents: read
      issues: write
      pull-requests: write
      id-token: write
    steps:
      # Defense in depth behind the job-level `if:` sender gate: an explicit
      # step that re-asserts the authorized-sender allowlist BEFORE minting any
      # token, so a spoof-shaped gap in the `if:` expression can never mint
      # credentials. Token-free — mirrors the `if:` gate.
      - name: Verify sender is authorized
        env:
          SENDER: ${{ github.event.sender.login }}
        run: |
          case "$(printf '%s' "$SENDER" | tr '[:upper:]' '[:lower:]')" in
            "evanharmon1") echo "$SENDER is authorized"; exit 0 ;;
          esac
          echo "::error::$SENDER is not an authorized sender"
          exit 1
      # Claim lifecycle: the run owns the issue or PR while it works, so a
      # human or another agent can see the work is taken. Written with
      # GITHUB_TOKEN under the job permissions above — it stays valid for the
      # whole job (an App token expires in an hour, well inside this timeout)
      # and its writes never trigger another workflow run.
      #
      # The label is CREATED when the repo lacks it: the add-label endpoint
      # does not create one, and a default rendered repo has no
      # `setup:github-labels` task (that task is gated on project_management /
      # foreman), so claim:claude is a tool-owned, auto-created label in the
      # D10 taxonomy sense. Color and description are the registry's verbatim
      # (`agent-registry.json` → `claim:claude`), so a later provisioning run
      # reconciles the label instead of fighting this one.
      #
      # Ownership hygiene, NOT locking: a target that is already claimed —
      # typically an interactive Claude session working the same issue — keeps
      # its claim, and this run neither re-adds nor releases it. Claims are
      # documented as signals rather than locks, so two runs starting in the
      # same instant can still both read "unclaimed" and race; that residual is
      # accepted. Every step is fail-soft: the claim is advisory, so a
      # transient API error must not cost an authorized request its run.
      - name: Claim the target with claim:claude
        id: claim
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TARGET: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: |
          acquired=false
          if [ -z "$TARGET" ]; then
            echo "No issue or pull request number; nothing to claim"
          elif ! existing=$(gh api "repos/$GH_REPO/issues/$TARGET/labels" --jq '.[].name'); then
            echo "::warning::could not read the labels on #$TARGET; not claiming"
          elif printf '%s\n' "$existing" | grep -qx 'claim:claude'; then
            echo "::notice::#$TARGET is already claimed; leaving the existing claim in place"
          else
            gh api "repos/$GH_REPO/labels" -f name='claim:claude' -f color='006B75' \
              -f description='Claimed by Claude' >/dev/null 2>&1 ||
              echo "claim:claude already exists in this repository"
            if gh api "repos/$GH_REPO/issues/$TARGET/labels" -f 'labels[]=claim:claude' >/dev/null; then
              acquired=true
            else
              echo "::warning::could not apply claim:claude to #$TARGET"
            fi
          fi
          echo "acquired=$acquired" >>"$GITHUB_OUTPUT"
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          # Least-privilege token: plan only comments (issues/pull-requests) and
          # reads the repo (no push).
          permission-contents: read
          permission-issues: write
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: anthropics/claude-code-action@be7b93b1907a4abad570368f3c74b6fe3807510b # v1.0.183
        # Step-level cap, 10 minutes under the job budget. A JOB timeout
        # kills the runner outright and the always() release below never
        # runs; a STEP timeout fails only this step and lets the cleanup
        # run, so the claim is still released. Losing the runner itself
        # (or a force-cancel) can still strand the advisory label —
        # accepted, rather than a reconciliation workflow of its own.
        timeout-minutes: 110
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.app-token.outputs.token }}
          trigger_phrase: "@claude plan"
          track_progress: true
          base_branch: main
          branch_prefix: claude/
          # --max-budget-usd caps API-key spend; likely a no-op under
          # CLAUDE_CODE_OAUTH_TOKEN (subscription) billing. Real runaway guards
          # are timeout-minutes (job- and step-level) and --max-turns.
          claude_args: "--model opus --effort max --max-budget-usd 10 --disallowedTools Edit Write Bash --max-turns 120"
          prompt: |
            Post the plan as a comment. Do not write code or modify files.
            Focus on the specific task described in the triggering comment or
            issue. Cite relevant files and existing patterns in the repo.
      # Release the claim on EVERY terminal path — success, failure, step
      # timeout, and cancellation alike — so a spent run never leaves a stale
      # claim behind. Gated on this run having ACQUIRED the claim: a claim that
      # was already on the target belongs to whoever made it, and an
      # unauthorized event never reaches the claim step at all, so neither is
      # released here.
      - name: Release the claim
        if: always() && steps.claim.outputs.acquired == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TARGET: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: |
          if [ -z "$TARGET" ]; then
            exit 0
          fi
          gh api -X DELETE "repos/$GH_REPO/issues/$TARGET/labels/claim:claude" >/dev/null 2>&1 ||
            echo "::notice::claim:claude was already absent from #$TARGET"
