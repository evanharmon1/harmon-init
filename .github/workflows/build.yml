name: Build & Validate
run-name: ${{ github.actor }} is running Build & Validate
on:
  push:
    branches: [main]
  # No `edited`: it fires on a PR title/body edit, and the dev loop's readiness
  # gate REQUIRES body edits (ticking `## Deferred findings`), so carrying it
  # here made satisfying one gate condition invalidate another — every
  # settlement restarted check, repo-guards, security and all seven template-test profiles
  # (harmon-init#1328). `edited` also fires on a base-BRANCH change; dropping
  # that re-run is deliberate. Retargeting a PR is rare, and
  # `strict_required_status_checks_policy` already forces an up-to-date head
  # before merge, which lands as a `synchronize` this list does cover.
  # Title/body-dependent guards keep `edited` in their OWN workflows:
  # closing-keywords.yml and release-content-guard.yml.
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  merge_group:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Parallel jobs that all call into the Taskfile so local + CI run identical
# commands. Toolchain setup goes through the shared ./.github/actions/setup
# composite action (the same one the Claude automation workflows use). The
# template-test job stays bespoke: it exercises copier renders, which need
# copier + the devcontainer CLI the composite doesn't install.

jobs:
  changes:
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Both parents of the PR merge ref: first parent is the live base.
          fetch-depth: 2
      - name: Classify docs-only changes (fail closed)
        id: classify
        run: ./scripts/ci-changes-classify.sh >> "$GITHUB_OUTPUT"

  check:
    # Runner switch: CI_RUNS_ON repo/org variable unset -> the rendered
    # default; set it to a JSON runner spec to override without a commit.
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history lets check compare tool pins against the merge base.
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          lint-tools: "true"
      - name: Check
        run: task check

  repo-guards:
    # Runner switch: CI_RUNS_ON repo/org variable unset -> the rendered
    # default; set it to a JSON runner spec to override without a commit.
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history + tags make test:tag-hygiene a real assertion.
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          lint-tools: "true"
      # The suite renders the template (test:dogfood-structure,
      # test:copier-validators), so copier has to be installed first. Installed
      # explicitly rather than via scripts/install-copier.sh: that script no-ops
      # when brew is present, and GitHub's ubuntu images ship linuxbrew — it
      # would leave copier missing here. uv comes from the composite action.
      - name: Install copier (the suite's render-based checks need it)
        run: |
          # --force for the same reason scripts/install-copier.sh uses it: it
          # overwrites a foreign same-named entry point (e.g. a stale pipx shim)
          # instead of aborting, keeping reruns idempotent on a persistent
          # self-hosted CI_RUNS_ON runner.
          uv tool install --force copier
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # Outside ci:repo-guards: deleting its suite call must not silence this guard.
      - name: Verify-CI parity guard (runs outside the task it guards)
        run: task test:verify-ci-parity
      - name: Repository guards
        run: task ci:repo-guards

  devcontainer-permissions:
    needs: changes
    # Runner switch: CI_RUNS_ON repo/org variable unset -> the rendered
    # default; set it to a JSON runner spec to override without a commit.
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    if: >-
      !cancelled() &&
      (github.event_name != 'pull_request' ||
       (github.event.pull_request.head.repo.full_name == github.repository &&
        (needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true')))
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Devcontainer permissions
        run: task test:devcontainer:permissions

  session-cleanup-stress:
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Repeat cleanup regression
        run: task stress:session-cleanup

  security:
    # Runner switch: CI_RUNS_ON repo/org variable unset -> the rendered
    # default; set it to a JSON runner spec to override without a commit.
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          gitleaks: "true"
      - name: Secrets scan
        run: task security:secrets
      - name: Dependency audit
        run: task security:audit
      - name: SAST (Semgrep Community Edition)
        run: task security:sast

  template-test:
    # Runner switch: CI_RUNS_ON repo/org variable unset -> the rendered
    # default; set it to a JSON runner spec to override without a commit.
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        profile: [minimal, web, webapp, iac, full, meta, update]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Install copier and validation tools
        run: |
          pipx install copier
          pip install yamllint
          npm install -g @devcontainers/cli lefthook
          # renovate: datasource=github-releases depName=rhysd/actionlint extractVersion=^v?(?<version>.+)$
          ACTIONLINT_VERSION=1.7.12
          curl -fsSL --retry 3 "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C /tmp actionlint
          sudo mv /tmp/actionlint /usr/local/bin/
          # renovate: datasource=github-releases depName=gitleaks/gitleaks extractVersion=^v?(?<version>.+)$
          GITLEAKS_VERSION=8.30.1
          curl -fsSL --retry 3 -o /tmp/gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tgz -C /tmp
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          # yq parses rendered workflows in the checkout persist-credentials audit.
          # GitHub-hosted images ship it, but a self-hosted CI_RUNS_ON runner may
          # not — and test-template.sh's `required` is fatal under GITHUB_ACTIONS,
          # so a missing yq would fail every template-test profile, not just the
          # audit. Install it explicitly rather than inheriting it.
          # Must be mikefarah/yq: `pip install yq` is a different tool (a jq
          # wrapper) whose expression syntax this audit does not use.
          # renovate: datasource=github-releases depName=mikefarah/yq extractVersion=^v?(?<version>.+)$
          YQ_VERSION=4.54.1
          curl -fsSL --retry 3 -o /tmp/yq \
            "https://github.com/mikefarah/yq/releases/download/v${YQ_VERSION}/yq_linux_amd64"
          sudo install -m 0755 /tmp/yq /usr/local/bin/yq
          # `file` backs the rendered lint-hygiene.sh's binary detection, which
          # fails closed. test-template.sh runs that rendered script directly, so
          # a runner without `file` would abort every profile before validation.
          # This job uses .github/actions/setup without its lint-tools input,
          # so that action does not install `file` for this path. Same
          # self-hosted reasoning as yq above.
          ./scripts/ensure-file.sh
      - name: Configure git identity (copier renders run git init)
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@users.noreply.github.com"
          git config --global init.defaultBranch main
      - name: Render and validate template profile
        run: task test:template:${{ matrix.profile }}
      # Strict Renovate validation resolves Renovate from npm and is therefore
      # an explicit CI/local-CI task; ordinary `task verify` stays offline.
      - name: Strictly validate rendered Renovate config
        run: task test:renovate-config -- ${{ matrix.profile }}

  verify:
    if: always()
    needs: [changes, check, repo-guards, devcontainer-permissions, template-test, session-cleanup-stress]
    # Runner switch: CI_RUNS_ON repo/org variable unset -> the rendered
    # default; set it to a JSON runner spec to override without a commit.
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    env:
      CI_EVENT_NAME: ${{ github.event_name }}
      CHANGES_RESULT: ${{ needs.changes.result }}
      DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
      IS_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
    steps:
      # Never check out or run fork-controlled repository code on this path.
      - name: Verify deliberate skips at the untrusted-fork boundary
        if: env.IS_FORK == 'true'
        env:
          CHECK_RESULT: ${{ needs.check.result }}
          REPO_GUARDS_RESULT: ${{ needs.repo-guards.result }}
          DEVCONTAINER_PERMISSIONS_RESULT: ${{ needs.devcontainer-permissions.result }}
          TEMPLATE_TEST_RESULT: ${{ needs.template-test.result }}
        run: |
          fail=0
          check_skipped() {
            if [ "$2" != "skipped" ]; then
              echo "Job $1 result: $2 (expected skipped for an untrusted fork)"
              fail=1
            fi
          }
          check_skipped changes "$CHANGES_RESULT"
          check_skipped check "$CHECK_RESULT"
          check_skipped repo-guards "$REPO_GUARDS_RESULT"
          check_skipped devcontainer-permissions "$DEVCONTAINER_PERMISSIONS_RESULT"
          check_skipped template-test "$TEMPLATE_TEST_RESULT"
          if [ "$fail" -ne 0 ]; then
            exit 1
          fi
          echo "Untrusted fork trust boundary enforced: all repository-controlled jobs were deliberately skipped."
      - if: env.IS_FORK != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify required jobs succeeded
        if: env.IS_FORK != 'true'
        env:
          EXPECTED_RESULT: success
          DOCS_ONLY_JOBS: "devcontainer-permissions"
          CHECK_RESULT: ${{ needs.check.result }}
          REPO_GUARDS_RESULT: ${{ needs.repo-guards.result }}
          DEVCONTAINER_PERMISSIONS_RESULT: ${{ needs.devcontainer-permissions.result }}
          TEMPLATE_TEST_RESULT: ${{ needs.template-test.result }}
        run: ./scripts/verify-ci-results.sh "changes=${CHANGES_RESULT}" "check=${CHECK_RESULT}" "repo-guards=${REPO_GUARDS_RESULT}" "devcontainer-permissions=${DEVCONTAINER_PERMISSIONS_RESULT}" "template-test=${TEMPLATE_TEST_RESULT}"
