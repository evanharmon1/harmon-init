name: Build & Validate
run-name: ${{ github.actor }} is running Build & Validate
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Parallel jobs that all call into the Taskfile so local + CI run identical
# commands. Toolchain setup goes through the shared ./.github/actions/setup
# composite action (the same one the Claude automation workflows use). The
# template-test job stays bespoke: it exercises copier renders, which need
# copier + the devcontainer CLI the composite doesn't install.

jobs:
  lint:
    # Runner switch: CI_RUNS_ON repo/org variable unset -> the rendered
    # default; set it to a JSON runner spec to override without a commit.
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history + tags so `test:tag-hygiene` below is a real assertion.
          # The default shallow, tagless checkout leaves `git describe` with
          # nothing to select, which would make that guard vacuous here — and a
          # poisoned tag on origin is precisely what CI should name outright
          # rather than surfacing as seven opaque template-test failures.
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          lint-tools: "true"
      - name: Lint
        run: task check
      - run: task test:tasks
      - run: task test:codex-review
      - run: task test:ci-results
      - run: task test:status
      - run: task test:renovate-pins
      - run: task test:release-title
      - run: task test:setup-github-project
      - run: task test:sync-devkit-release
      - run: task test:devcontainer:image:automation
      - run: task test:skills-pin-parity
      # Meaningful only because this job checks out with fetch-depth: 0 above.
      - name: Tag hygiene (no non-release tag where git describe would select it)
        run: task test:tag-hygiene
      - name: Template independence (no harmon-dotfiles/chezmoi in shipped output)
        run: task test:template-independence
      # Root-only, like the independence guard above: a generated repo has no
      # template/ to scan, so this has no twin in build.yml.jinja. It must be
      # listed HERE and not only in `verify` — this job enumerates its steps by
      # hand, so a check added to `verify` alone never runs in CI and the
      # invariant regresses under a green aggregate check (#614, same drift).
      - name: Category gates (no template file gated on skill_categories)
        run: task test:category-gates
      - name: Dogfood parity (verbatim template files match their root twins)
        run: task test:dogfood-parity
      # The structure check renders template/, so it needs copier. Installed
      # explicitly rather than via scripts/install-copier.sh: that script no-ops
      # when brew is present, and GitHub's ubuntu images ship linuxbrew — it
      # would leave copier missing here. uv comes from the composite action.
      - name: Install copier (dogfood structure check renders the template)
        run: |
          # --force for the same reason scripts/install-copier.sh uses it: it
          # overwrites a foreign same-named entry point (e.g. a stale pipx shim)
          # instead of aborting, keeping reruns idempotent on a persistent
          # self-hosted CI_RUNS_ON runner.
          uv tool install --force copier
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Dogfood structure (template sections/tasks exist in the root layer)
        run: task test:dogfood-structure
      - name: Skills drift check (vendored skills vs pinned harmon-devkit ref)
        run: task verify:skills
      - run: task test:hooks
      - run: task test:statusline
      - run: task test:devcontainer:permissions

  security:
    # Runner switch: CI_RUNS_ON repo/org variable unset -> the rendered
    # default; set it to a JSON runner spec to override without a commit.
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          gitleaks: "true"
      - name: Secrets scan
        run: task security:secrets
      - name: Dependency audit
        run: task security:audit
      - name: SAST (Semgrep Community Edition)
        run: task security:sast

  template-test:
    # Runner switch: CI_RUNS_ON repo/org variable unset -> the rendered
    # default; set it to a JSON runner spec to override without a commit.
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        profile: [minimal, web, webapp, iac, full, meta, update]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # renovate: datasource=node-version depName=node
          node-version: "24"
      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          # renovate: datasource=github-releases depName=go-task/task extractVersion=^v(?<version>.+)$
          version: 3.51.1
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install copier and validation tools
        run: |
          pipx install copier
          pip install yamllint
          npm install -g @devcontainers/cli lefthook pnpm
          # renovate: datasource=github-releases depName=rhysd/actionlint extractVersion=^v?(?<version>.+)$
          ACTIONLINT_VERSION=1.7.12
          curl -fsSL --retry 3 "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C /tmp actionlint
          sudo mv /tmp/actionlint /usr/local/bin/
          # renovate: datasource=github-releases depName=gitleaks/gitleaks extractVersion=^v?(?<version>.+)$
          GITLEAKS_VERSION=8.24.3
          curl -fsSL --retry 3 -o /tmp/gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tgz -C /tmp
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          # yq parses rendered workflows in the checkout persist-credentials audit.
          # GitHub-hosted images ship it, but a self-hosted CI_RUNS_ON runner may
          # not — and test-template.sh's `required` is fatal under GITHUB_ACTIONS,
          # so a missing yq would fail every template-test profile, not just the
          # audit. Install it explicitly rather than inheriting it.
          # Must be mikefarah/yq: `pip install yq` is a different tool (a jq
          # wrapper) whose expression syntax this audit does not use.
          # renovate: datasource=github-releases depName=mikefarah/yq extractVersion=^v?(?<version>.+)$
          YQ_VERSION=4.53.3
          curl -fsSL --retry 3 -o /tmp/yq \
            "https://github.com/mikefarah/yq/releases/download/v${YQ_VERSION}/yq_linux_amd64"
          sudo install -m 0755 /tmp/yq /usr/local/bin/yq
          # `file` backs the rendered lint-hygiene.sh's binary detection, which
          # fails closed. test-template.sh runs that rendered script directly, so
          # a runner without `file` would abort every profile before validation.
          # This job does not use .github/actions/setup, so installing it there
          # does not cover this path. Same self-hosted reasoning as yq above.
          ./scripts/ensure-file.sh
      - name: Configure git identity (copier renders run git init)
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@users.noreply.github.com"
          git config --global init.defaultBranch main
      - run: task test:template:${{ matrix.profile }}

  verify:
    if: always()
    needs: [lint, template-test]
    # Runner switch: CI_RUNS_ON repo/org variable unset -> the rendered
    # default; set it to a JSON runner spec to override without a commit.
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    env:
      IS_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
    steps:
      # Never check out or run fork-controlled repository code on this path.
      - name: Verify deliberate skips at the untrusted-fork boundary
        if: env.IS_FORK == 'true'
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          TEMPLATE_TEST_RESULT: ${{ needs.template-test.result }}
        run: |
          fail=0
          check_skipped() {
            if [ "$2" != "skipped" ]; then
              echo "Job $1 result: $2 (expected skipped for an untrusted fork)"
              fail=1
            fi
          }
          check_skipped lint "$LINT_RESULT"
          check_skipped template-test "$TEMPLATE_TEST_RESULT"
          if [ "$fail" -ne 0 ]; then
            exit 1
          fi
          echo "Untrusted fork trust boundary enforced: all repository-controlled jobs were deliberately skipped."
      - if: env.IS_FORK != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify required jobs succeeded
        if: env.IS_FORK != 'true'
        env:
          EXPECTED_RESULT: success
          LINT_RESULT: ${{ needs.lint.result }}
          TEMPLATE_TEST_RESULT: ${{ needs.template-test.result }}
        run: ./scripts/verify-ci-results.sh "lint=${LINT_RESULT}" "template-test=${TEMPLATE_TEST_RESULT}"
