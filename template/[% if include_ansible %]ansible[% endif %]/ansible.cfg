# Ansible configuration for this project.
# https://docs.ansible.com/ansible/latest/reference_appendices/config.html
[defaults]
inventory = inventory/hosts.yaml
roles_path = roles
host_key_checking = false
# TODO: defaults to the connecting user; set explicitly if needed.
# remote_user = your-user

[privilege_escalation]
become = true
become_method = sudo

[ssh_connection]
pipelining = true
