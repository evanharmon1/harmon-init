# copier.yml for the harmon-init Copier project template
# Generate a new project: `copier copy harmon-init new-project --trust`
# Apply/update an existing project: `copier update --trust` (inside the project)
#
# NOTE: custom jinja delimiters are set via _envops below — template variables
# use [[ var ]] and blocks use [% if x %]. This lets GitHub Actions `${{ }}`,
# go-task `{{.VAR}}`, and lefthook `{staged_files}` appear verbatim in template
# files with zero escaping.

# ── Asked questions ─────────────────────────────────────────────────

project_name:
  type: str
  help: "NAME: Formal name of the project (Project Name)"
  placeholder: "Formal Project Name"

project_slug:
  type: str
  help: "SLUG: Project slug (project-slug)"
  default: "[[ project_name.lower().replace(' ', '-') ]]"

project_description:
  type: str
  help: "DESCRIPTION: Short description of the project"
  default: "TODO: project_description"

# Hidden author identity (defaults rarely change) — defined early so asked
# questions below can reference them in their own defaults.
author_first_name:
  type: str
  default: Evan
  when: false

author_last_name:
  type: str
  default: Harmon
  when: false

author_full_name:
  type: str
  default: "[[ author_first_name + ' ' + author_last_name ]]"
  when: false

author_email:
  type: str
  default: "evan@evanharmon.com"
  when: false

author_url:
  type: str
  default: "https://evanharmon.com"
  when: false

author_git_provider_username:
  type: str
  default: evanharmon1
  when: false

github_org:
  type: str
  help: "GITHUB ORG: GitHub org/user that will own the repo (drives repo URL, GHCR images, workflows)"
  default: "[[ author_git_provider_username ]]"

code_owner:
  type: str
  help: "CODE OWNER: GitHub user/team for CODEOWNERS (org repos may use org/team)"
  # Defaults to the human author, NOT github_org: GitHub rejects a bare org as a
  # CODEOWNERS principal ("Unknown owner"), which silently makes
  # require-code-owner-review match nobody. An org/team (`@org/team`) is a valid
  # answer, but must be chosen deliberately.
  default: "[[ author_git_provider_username ]]"

claude_authorized_members:
  type: str
  help: "CLAUDE ACTIONS: comma-separated GitHub usernames allowed to trigger @claude plan/implement/review. An explicit allowlist (not org membership); the review workflow additionally allows the renovate/coderabbit/dependabot bots. Add more with `user-a,user-b`."
  default: "[[ author_git_provider_username ]]"

project_type:
  type: str
  help: "TYPE: What kind of project is this? (drives Taskfile, CI jobs, devcontainer tooling)"
  choices:
    general: general
    web-astro (marketing/static sites): web-astro
    web-app (TanStack/React apps): web-app
    iac (Terraform/Ansible): iac
    docs (documentation/Obsidian): docs
  default: general

snyk_scan_schedule:
  type: str
  help: >-
    SNYK: Optional advisory SAST/SCA schedule. Off keeps Snyk manual/local;
    weekly is the quota-aware opt-in; daily is intended for public repos or
    accepted unlimited open-source projects.
  choices:
    "Off (manual/local only)": "off"
    "Weekly (quota-aware)": weekly
    "Daily (public or unlimited OSS)": daily
  default: "off"

include_terraform:
  type: bool
  help: "TERRAFORM: Include a terraform/ skeleton + terraform linting?"
  default: "[[ project_type == 'iac' ]]"

include_ansible:
  type: bool
  help: "ANSIBLE: Include an ansible/ skeleton + ansible linting?"
  default: "[[ project_type == 'iac' ]]"

ci_runner:
  type: str
  help: "CI RUNNER: default GitHub Actions runner (the CI_RUNS_ON repo/org variable overrides at runtime)"
  choices:
    - ubuntu-latest
    - self-hosted
  default: ubuntu-latest

deploy_cloudflare_workers:
  type: bool
  help: "DEPLOY: Deploy the site to Cloudflare Workers (static assets) from CI? (PR preview versions + release-gated production; the sommerlawn-site pattern)"
  default: "[[ project_type == 'web-astro' ]]"
  when: "[[ project_type in ['web-astro', 'web-app'] ]]"

license:
  type: str
  help: "LICENSE: Add license?"
  choices:
    - mit
    - private
  default: mit

use_release_please:
  type: bool
  help: "RELEASE-PLEASE: Manage releases with release-please? (opens a rolling release PR you merge intentionally; CHANGELOG auto-generated from conventional commits)"
  default: yes

release_content_paths:
  type: str
  help: "RELEASE GUARD: Space-separated folders whose changes MUST ship in a release, e.g. 'src' or 'ai/skills templates' (a folder matches everything beneath it). Because squash-merge uses the PR title and release-please only tags feat/fix, a PR touching these must use a fix:/feat: title — a CI check (release-content-guard.yml) enforces it so tag-pinned consumers actually receive the change. Empty = no guard."
  default: ""
  when: "[[ use_release_please ]]"

use_skills_sync:
  type: bool
  help: "SKILLS SYNC: Vendor shared agent skills from harmon-devkit (pinned, drift-checked)?"
  default: yes

skill_categories:
  type: str
  help: "SKILLS: Which shared-skill categories to vendor? (seeded from project type; edit later in .skills-sync.yaml)"
  multiselect: true
  choices:
    universal: universal
    backend: backend
    frontend: frontend
    infra: infra
    mobile: mobile
    repo: repo
  # Seed the selection from the project type; the user can toggle any category.
  # Folded scalar (joined with spaces) purely to keep each source line short.
  default: >-
    [[ ['universal']
    + (['frontend'] if project_type in ['web-astro', 'web-app'] else [])
    + (['backend'] if project_type == 'web-app' else [])
    + (['infra'] if (include_terraform or include_ansible or project_type == 'iac') else []) ]]
  when: "[[ use_skills_sync ]]"

use_foreman:
  type: bool
  help: "FOREMAN: Include foreman — deterministic supervisor that dispatches ready issues to headless agents, verifies, opens PRs, shepherds them (task foreman:*; Python 3.11+ at runtime)?"
  default: yes

use_codeql:
  type: bool
  help: >-
    CODEQL: Include GitHub CodeQL SAST for selected first-party source languages?
    Public repositories receive CodeQL for free. Private/internal repositories
    require GitHub Code Security (billed by active committer) plus an explicit
    FULL_SECURITY_SCAN=true repository variable; otherwise leave this off and
    use the generated Semgrep CE baseline.
  default: "[[ project_type in ['web-astro', 'web-app'] ]]"

codeql_languages:
  type: str
  help: "CODEQL LANGUAGES: Record first-party source languages CodeQL should analyze when enabled (do not select a language only because tooling uses it)"
  multiselect: true
  choices:
    JavaScript / TypeScript: javascript-typescript
    Python: python
  default: >-
    [[ ((['javascript-typescript'] if project_type in ['web-astro', 'web-app'] else [])
    + (['python'] if (include_ansible or project_type == 'iac'
    or use_foreman) else [])) if use_codeql else [] ]]
  validator: "[% if use_codeql and not codeql_languages %]Select at least one first-party CodeQL language.[% endif %]"

devcontainer:
  type: bool
  help: "DEVCONTAINER: Add dual-profile .devcontainer (AI bot + human dev)?"
  default: yes

project_management:
  type: str
  help: "PROJECT MGMT: Add a project-management doc (docs/project-management.md)?"
  choices:
    none: none
    GitHub Projects: github
    Linear (TODO stub): linear
  default: none

git_init:
  type: bool
  help: "GIT INIT: Initialize git repo?"
  default: yes

github_remote_create:
  type: bool
  help: "GITHUB REMOTE: Create the remote repo on GitHub (gh repo create, private, pushes initial state)?"
  default: no

github_release_init:
  type: bool
  help: "RELEASE: Create an initial release (task release:init)?"
  default: no

bunch_add:
  type: bool
  help: "BUNCH: Add Bunch file to project (macOS-only, moves file to iCloud)?"
  default: no

obsidian_project_add:
  type: bool
  help: "OBSIDIAN: Add Obsidian project note to the vault (macOS-only)?"
  default: no

run_task_install:
  type: bool
  help: "TASK INSTALL: Run 'task install' after generation (brew bundle + git hooks)?"
  default: no

# ── Hidden defaults (when: false) ───────────────────────────────────

organization:
  type: str
  default: "Harmon Lab"
  when: false

organization_url:
  type: str
  default: "https://harmonlab.net"
  when: false

organization_email:
  type: str
  default: "evan@evanharmon.com"
  when: false

repo_url:
  type: str
  default: "https://github.com/[[ github_org ]]/[[ project_slug ]]"
  when: false

# Render-time fallback for `runs-on:` in generated workflows. At runtime the
# CI_RUNS_ON GitHub Actions variable (repo or org level, JSON: '"ubuntu-latest"'
# or '["self-hosted","linux",...]') overrides this without a re-render — so a
# downed self-hosted runner box is a variable flip, not a template update.
ci_runs_on_default:
  type: str
  default: "[% if ci_runner == 'self-hosted' %][\"self-hosted\", \"linux\"][% else %]\"ubuntu-latest\"[% endif %]"
  when: false

use_node:
  type: bool
  default: "[[ project_type in ['web-astro', 'web-app'] ]]"
  when: false

use_python:
  type: bool
  default: "[[ include_ansible or project_type == 'iac' ]]"
  when: false

devcontainer_image:
  type: str
  default: "ghcr.io/[[ github_org ]]/[[ project_slug ]]-devcontainer"
  when: false

# Paths
projects_directory:
  type: str
  default: ~/git
  when: false

bunches_directory:
  type: str
  default: "/Users/evan/Library/Mobile Documents/com~apple~CloudDocs/Bunches"
  when: false

obsidian_directory:
  type: str
  default: "/Users/evan/Local/Memex"
  when: false

# Demographics
country:
  type: str
  default: United States
  when: false

state:
  type: str
  default: Kansas
  when: false

# Date & Time
current_date:
  type: str
  default: "[[ '%Y-%m-%d' | strftime ]]"
  when: false

current_year:
  type: str
  default: "[[ '%Y' | strftime ]]"
  when: false

# ── Post-generation tasks ───────────────────────────────────────────
# All side-effectful tasks default to no so `copier copy --defaults` is
# CI-safe (except git_init, which only touches the new project directory).

# First-run-only tasks are gated on `_copier_operation == 'copy'` so they do
# NOT re-run on `copier update` (which would make a spurious scaffold commit,
# re-init git, re-create the remote, re-cut a release, or re-move the macOS meta
# files). `task install` is intentionally left ungated — re-running it on update
# refreshes brew deps + lefthook hooks against any updated config.
_tasks:
  # Both git commands are idempotent so adopting harmon-init INTO an existing
  # repo (`copier copy` over a checkout with its own history) is a safe no-op
  # here: `[ -d .git ]` skips re-init, and the HEAD guard skips the scaffold
  # commit when commits already exist. On a fresh scaffold neither guard fires.
  - command: "[ -d .git ] || git init -b main"
    when: "[[ git_init and _copier_operation == 'copy' ]]"
  # Initial commit — gh repo create --push and task release:init both need
  # HEAD to exist. Runs before `task install`, so lefthook hooks are not yet
  # installed and nothing intercepts this commit. Skipped when HEAD already
  # exists (adopt-over-existing) so it never makes a spurious scaffold commit.
  - command: 'git rev-parse --verify HEAD >/dev/null 2>&1 || { git add -A && git commit -m "chore: initial scaffold from harmon-init"; }'
    when: "[[ git_init and _copier_operation == 'copy' ]]"
  # The remaining side effects are FRESH-SCAFFOLD ONLY, so they are also gated on
  # `git_init` (the fresh-scaffold signal — adopt-over-existing always passes
  # git_init=false). `copier copy` seeds answer defaults from an EXISTING
  # .copier-answers.yml, so a re-adopt would otherwise carry a stale `true`
  # forward and (e.g.) re-run `gh repo create` or cut a bogus `release:init`
  # v0.1.0 over a repo already on v2/v3. The two externally-visible tasks also
  # carry their own idempotency guard (skip if origin/tags already exist).
  - command: 'git remote get-url origin >/dev/null 2>&1 || gh repo create [[ github_org ]]/[[ project_slug ]] --private --source=. --push'
    when: "[[ git_init and github_remote_create and _copier_operation == 'copy' ]]"
  - command: task install
    when: "[[ run_task_install ]]"
  - command: 'git tag | grep -q . || task release:init'
    when: "[[ git_init and github_release_init and _copier_operation == 'copy' ]]"
  - command: task util:bunch-install
    when: "[[ git_init and bunch_add and _copier_operation == 'copy' ]]"
  - command: task util:obsidian-install
    when: "[[ git_init and obsidian_project_add and _copier_operation == 'copy' ]]"

# ── Copier settings ─────────────────────────────────────────────────

_min_copier_version: "9.4.0"

_subdirectory: template

# Files copier must NEVER merge into on `copier update` — kept deliberately
# minimal. Everything else (README, AGENTS.md, DESIGN.md, docs, …) is left OUT so
# copier's three-way merge keeps delivering template improvements (e.g. a new
# README section) while preserving the repo's own edits; only overlapping edits
# conflict, and the update flow reconciles those. `_skip_if_exists` freezes a
# file entirely, so it is reserved for content owned by another generator or by
# the consumer (their own access decisions):
#   - CHANGELOG.md — release-please owns it; template merges would fight it.
_skip_if_exists:
  - CHANGELOG.md
  # The workspace is generated once with a random peacock color and then tracked
  # by the consumer; freeze it so `copier update` never regenerates a new color
  # (which would churn a now-committed file on every update).
  - "*.code-workspace"
  # CODEOWNERS encodes the repo's real access control (who must review / is
  # auto-requested). The template renders it from the single `code_owner` answer
  # (`* @code_owner`), which can't represent a second owner or a team — so a
  # Path-B adopt over a repo with MORE owners would silently DROP them (a security
  # regression). Freeze it: a fresh scaffold still gets `* @code_owner`; an
  # existing CODEOWNERS is never clobbered on adopt/update.
  - .github/CODEOWNERS
  # related-repos.txt is the repo's curated list of sibling repos to clone/fetch
  # in the devcontainer (the bootstrap/fetch scripts are template-owned and keep
  # updating; only the list is per-repo). Ship an empty stub on first scaffold,
  # then freeze it so `copier update` never overwrites a populated list.
  - .devcontainer/related-repos.txt
  # .release-please-manifest.json is release-please state (the repo's current
  # released version), not template content. The template only seeds it (0.0.0)
  # for a fresh scaffold; every repo that has cut a release carries a real
  # version, so an unfrozen copy conflicts on EVERY `copier update` (seed vs
  # real) and a careless resolution regresses release tracking. Same rationale
  # as CHANGELOG.md above: freeze it — fresh scaffolds still get the seed; an
  # existing manifest is never clobbered.
  - .release-please-manifest.json

# Keep CLAUDE.md/GEMINI.md as symlinks to AGENTS.md in generated projects
# (without this, copier dereferences symlinks into duplicate files).
_preserve_symlinks: true

# Custom jinja delimiters — see header comment. trim/lstrip keep block tags
# on their own lines from leaving blank lines in rendered output.
_envops:
  block_start_string: "[%"
  block_end_string: "%]"
  variable_start_string: "[["
  variable_end_string: "]]"
  comment_start_string: "[#"
  comment_end_string: "#]"
  trim_blocks: true
  lstrip_blocks: true

# Variables containing password/key are excluded from .copier-answers.yml
_secret_questions:
  - password
  - key
