# copier.yml for the harmon-init Copier project template
# Generate a new project: `copier copy harmon-init new-project --trust`
# Apply/update an existing project: `copier update --trust` (inside the project)
#
# NOTE: custom jinja delimiters are set via _envops below — template variables
# use [[ var ]] and blocks use [% if x %]. This lets GitHub Actions `${{ }}`,
# go-task `{{.VAR}}`, and lefthook `{staged_files}` appear verbatim in template
# files with zero escaping.

# ── Asked questions ─────────────────────────────────────────────────

project_name:
  type: str
  help: "NAME: Formal name of the project (Project Name)"
  placeholder: "Formal Project Name"

project_slug:
  type: str
  help: "SLUG: Project slug (project-slug)"
  default: "[[ project_name.lower().replace(' ', '-') ]]"

project_description:
  type: str
  help: "DESCRIPTION: Short description of the project"
  default: "TODO: project_description"

# Hidden author identity (defaults rarely change) — defined early so asked
# questions below can reference them in their own defaults.
author_first_name:
  type: str
  default: Evan
  when: false

author_last_name:
  type: str
  default: Harmon
  when: false

author_full_name:
  type: str
  default: "[[ author_first_name + ' ' + author_last_name ]]"
  when: false

author_email:
  type: str
  default: "evan@evanharmon.com"
  when: false

author_url:
  type: str
  default: "https://evanharmon.com"
  when: false

author_git_provider_username:
  type: str
  default: evanharmon1
  when: false

github_org:
  type: str
  help: "GITHUB ORG: GitHub org/user that will own the repo (drives repo URL, GHCR images, workflows)"
  default: "[[ author_git_provider_username ]]"

code_owner:
  type: str
  help: "CODE OWNER: GitHub user/team for CODEOWNERS (org repos may use org/team)"
  # Defaults to the human author, NOT github_org: GitHub rejects a bare org as a
  # CODEOWNERS principal ("Unknown owner"), which silently makes
  # require-code-owner-review match nobody. An org/team (`@org/team`) is a valid
  # answer, but must be chosen deliberately.
  default: "[[ author_git_provider_username ]]"

claude_authorized_members:
  type: str
  help: >-
    CLAUDE ACTIONS: comma-separated GitHub usernames allowed to trigger the
    @claude commands (plan/implement/review). This is an explicit allowlist
    (not org membership); the review workflow additionally allows Renovate
    and Dependabot, plus
    CodeRabbit when opted in. Add more with `user-a,user-b`.
  default: "[[ author_git_provider_username ]]"

project_type:
  type: str
  help: "TYPE: What kind of project is this? (drives Taskfile, CI jobs, devcontainer tooling)"
  choices:
    general: general
    web-astro (marketing/static sites): web-astro
    web-app (TanStack/React apps): web-app
    iac (Terraform/Ansible): iac
    docs (documentation/Obsidian): docs
  default: general

snyk_scan_schedule:
  type: str
  help: >-
    SNYK: Optional advisory SAST/SCA schedule. Off keeps Snyk manual/local;
    weekly is the quota-aware opt-in; daily is intended for public repos or
    accepted unlimited open-source projects.
  choices:
    "Off (manual/local only)": "off"
    "Weekly (quota-aware)": weekly
    "Daily (public or unlimited OSS)": daily
  default: "off"

include_terraform:
  type: bool
  help: "TERRAFORM: Include a terraform/ skeleton + terraform linting?"
  default: "[[ project_type == 'iac' ]]"

include_ansible:
  type: bool
  help: "ANSIBLE: Include an ansible/ skeleton + ansible linting?"
  default: "[[ project_type == 'iac' ]]"

ci_runner:
  type: str
  help: "CI RUNNER: default GitHub Actions runner (the CI_RUNS_ON repo/org variable overrides at runtime)"
  choices:
    - ubuntu-latest
    - self-hosted
  default: ubuntu-latest

ci_runner_labels:
  type: str
  help: "CI RUNNER LABELS: comma-separated labels for self-hosted jobs (include self-hosted; add org/host labels to control routing)"
  default: self-hosted,linux
  when: "[[ ci_runner == 'self-hosted' ]]"
  validator: >-
    [%- set labels = ci_runner_labels.split(',') | map('trim') | list -%]
    [%- set invalid = namespace(value=false) -%]
    [%- for label in labels -%]
    [%- if not label -%]
    [%- set invalid.value = true -%]
    [%- endif -%]
    [%- for char in label -%]
    [%- if char not in 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789._-' -%]
    [%- set invalid.value = true -%]
    [%- endif -%]
    [%- endfor -%]
    [%- endfor -%]
    [% if 'self-hosted' not in labels %]
    Include the self-hosted label.
    [% elif invalid.value %]
    Labels may contain only ASCII letters, numbers, dots, underscores, and hyphens.
    [% endif %]

deploy_cloudflare_workers:
  type: bool
  help: "DEPLOY: Deploy the site to Cloudflare Workers (static assets) from CI? (PR preview versions + release-gated production; the sommerlawn-site pattern)"
  default: "[[ project_type == 'web-astro' ]]"
  when: "[[ project_type in ['web-astro', 'web-app'] ]]"

license:
  type: str
  help: "LICENSE: Add license?"
  choices:
    - mit
    - private
  default: mit

use_release_please:
  type: bool
  help: "RELEASE-PLEASE: Manage releases with release-please? (opens a rolling release PR you merge intentionally; CHANGELOG auto-generated from conventional commits)"
  default: yes

release_content_paths:
  type: str
  help: "RELEASE GUARD: Space-separated folders whose changes MUST ship in a release, e.g. 'src' or 'ai/skills templates' (a folder matches everything beneath it). Because squash-merge uses the PR title and release-please only tags feat/fix, a PR touching these must use a fix:/feat: title — a CI check (release-content-guard.yml) enforces it so tag-pinned consumers actually receive the change. Empty = no guard."
  default: ""
  when: "[[ use_release_please ]]"

use_skills_sync:
  type: bool
  help: >-
    SKILLS SYNC: Vendor shared agent skills from harmon-devkit (pinned,
    drift-checked)? Local vendoring and drift checks require no paid service.
    The generated GitHub sync workflow stays inert until you explicitly
    configure its CI GitHub App credentials. When enabled, that automation
    opens draft PRs; GitHub restricts drafts on private repositories to paid
    plans, so private free-plan repos must leave the automation unconfigured,
    become public, or upgrade. See docs/CHECKLIST.md.
  default: yes

skill_categories:
  type: str
  help: "SKILLS: Which shared-skill categories to vendor? (seeded from project type; edit later in .skills-sync.yaml)"
  multiselect: true
  choices:
    universal: universal
    backend: backend
    frontend: frontend
    infra: infra
    mobile: mobile
    repo: repo
  # Seed the selection from the project type; the user can toggle any category.
  # Folded scalar (joined with spaces) purely to keep each source line short.
  default: >-
    [[ ['universal']
    + (['frontend'] if project_type in ['web-astro', 'web-app'] else [])
    + (['backend'] if project_type == 'web-app' else [])
    + (['infra'] if (include_terraform or include_ansible or project_type == 'iac') else []) ]]
  when: "[[ use_skills_sync ]]"

use_shared_agents:
  type: bool
  help: "AGENTS: Also vendor harmon-devkit's shared subagents (e.g. implementer) into .claude/agents?"
  # Rides the same manifest, and therefore the same pinned ref, as the skills
  # above — a thin agent defers to a skill by reading it, so two pins that could
  # disagree would leave an agent following a procedure that no longer exists.
  # The manifest requests ["*"], so a new devkit agent arrives on the next pin
  # bump exactly as a new skill in a requested category already does.
  default: yes
  when: "[[ use_skills_sync ]]"

use_foreman:
  type: bool
  help: "FOREMAN: Wire up foreman — deterministic supervisor that dispatches ready issues to headless agents, verifies, opens PRs, shepherds them (task foreman:* wrapping a pinned uvx-run CLI from ponderousdev/foreman; needs uv and operator setup: bot identity, arming labels, rulesets)?"
  default: no

foreman_additional_trusted_actors:
  type: str
  help: >-
    FOREMAN TRUST: Additional comma-separated GitHub logins whose arming events
    and comment/review content Foreman may trust (for example, an operator App
    identity). Security-sensitive; leave empty unless each identity is
    intentionally authorized.
  default: ""
  when: "[[ use_foreman ]]"

use_codeql:
  type: bool
  help: >-
    CODEQL: Include GitHub CodeQL SAST for selected first-party source languages?
    Public repositories receive CodeQL for free. Private/internal repositories
    require GitHub Code Security (billed by active committer) plus an explicit
    FULL_SECURITY_SCAN=true repository variable; otherwise leave this off and
    use the generated Semgrep CE baseline.
  default: "[[ project_type in ['web-astro', 'web-app'] ]]"

codeql_languages:
  type: str
  help: "CODEQL LANGUAGES: Record first-party source languages CodeQL should analyze when enabled (do not select a language only because tooling uses it)"
  multiselect: true
  choices:
    JavaScript / TypeScript: javascript-typescript
    Python: python
  default: >-
    [[ ((['javascript-typescript'] if project_type in ['web-astro', 'web-app'] else [])
    + (['python'] if (include_ansible or project_type == 'iac')
    else [])) if use_codeql else [] ]]
  validator: "[% if use_codeql and not codeql_languages %]Select at least one first-party CodeQL language.[% endif %]"

use_codex_review:
  type: bool
  help: >-
    CODEX REVIEW: Add second-model review tasks (task review / task challenge →
    OpenAI Codex CLI) plus a toggle for the automatic Claude Code → Codex
    stop-gate review? Requires each developer to install and authenticate the
    Codex CLI themselves (ChatGPT account — free tier has tight usage limits —
    or a billed OpenAI API key); the Claude Code codex plugin (for the gate) is
    offered automatically on folder trust via .claude/settings.json. Local and
    advisory only: nothing runs in CI, no PR check depends on it, and the gate
    defaults off.
  default: no

use_codex_cloud_review:
  type: bool
  help: >-
    CODEX CLOUD REVIEW: Require a terminal Codex review attributable to every
    PR head before shepherding can report green? Defaults off and requires
    CODEX REVIEW. A maintainer must connect the repository to Codex cloud
    review through GitHub. Free-tier access is not assumed: availability and
    quotas depend on the maintainer's ChatGPT plan, and paid access may be
    required. Private repositories require explicit GitHub connector
    permission. This is a required shepherd signal, not a GitHub status check;
    after two unavailable attempts the agent stops and escalates.
  default: no
  when: "[[ use_codex_review ]]"
  validator: "[% if use_codex_cloud_review and not use_codex_review %]Enable CODEX REVIEW before CODEX CLOUD REVIEW.[% endif %]"

use_coderabbit:
  type: bool
  help: >-
    CODERABBIT: Add the CodeRabbit configuration and GitHub App setup
    instructions? Defaults off; Codex is the preferred second-model review
    path. CodeRabbit requires an account and App installation. Public
    open-source repositories can receive hosted PR reviews without a paid
    subscription (rate limits apply); the private-repository Free plan provides
    PR summaries only, and hosted code reviews require a paid plan after the
    14-day trial. Choosing no—including accepting the default when updating a
    repo created before this question existed—removes the template-managed
    CodeRabbit config and bot trust; remove the repo from the GitHub App
    installation separately.
  default: no

devcontainer:
  type: bool
  help: "DEVCONTAINER: Add dual-profile .devcontainer (AI bot + human dev)?"
  default: yes
  # Validated here (after both answers are typed) rather than on use_foreman:
  # a validator on the earlier question reads this one's raw default and lets
  # the forbidden combination through.
  validator: "[% if use_foreman and not devcontainer %]Foreman runs only inside the bot devcontainer (its D2 tripwire refuses any other environment) — enable devcontainer or disable use_foreman.[% endif %]"

use_statusline_pr_lookup:
  type: bool
  help: >-
    STATUSLINE PR LOOKUP: When Claude Code omits PR data, let the devcontainer
    status line make a bounded, cached read-only `gh pr view` lookup for the
    current branch? Requires a GitHub account and authenticated GitHub CLI.
    GitHub Free is sufficient for public repositories and private repositories
    the account can already read, but this grants no access: missing repository
    permission, token scopes, or SSO authorization leaves the PR segment empty.
    The lookup is disabled by default and never prompts for authentication.
  default: no
  when: "[[ devcontainer ]]"

devcontainer_coder_folder_uri:
  type: str
  help: >-
    CODER README BADGE: Optional captured VS Code Dev Containers folder URI for
    this repo's Coder-hosted dev container. Capture it from a real VS Code
    recent entry with scripts/open-devcontainer.sh; do not construct the
    dev-container+ hex payload by hand. Empty omits the personal badge while
    retaining the local clone-in-volume fallback. Requires an existing Coder
    account and workspace; Coder Community is free and self-hosted. Private
    repositories work only when that workspace already has repository access
    (for example, configured Git-provider OAuth or SSH credentials); this
    badge provisions neither Coder nor repository access.
  default: ""
  when: "[[ devcontainer ]]"
  validator: >-
    [%- set uri = devcontainer_coder_folder_uri -%]
    [%- set scheme = 'vscode-remote://' -%]
    [%- set literal_prefix = scheme + 'dev-container+' -%]
    [%- set escaped_prefix = scheme + 'dev-container%2b' -%]
    [%- set marker = '@ssh-remote+' -%]
    [%- set has_literal_prefix = uri.startswith(literal_prefix) -%]
    [%- set has_escaped_prefix = uri.startswith(scheme) and uri.lower().startswith(escaped_prefix) -%]
    [%- set prefix_length = literal_prefix|length if has_literal_prefix else escaped_prefix|length -%]
    [%- set encoded = uri.split(marker, 1)[0][prefix_length:] -%]
    [%- set target = uri.split(marker, 1)[1] if marker in uri else '' -%]
    [%- set invalid_hex = namespace(value=false) -%]
    [%- for char in encoded.lower() -%]
    [%- if char not in '0123456789abcdef' -%]
    [%- set invalid_hex.value = true -%]
    [%- endif -%]
    [%- endfor -%]
    [%- if uri and (not has_literal_prefix and not has_escaped_prefix
    or uri.count(marker) != 1
    or not encoded
    or (encoded|length) % 2 != 0
    or invalid_hex.value
    or '/workspaces/' not in target
    or not target.split('/workspaces/', 1)[0]
    or not target.split('/workspaces/', 1)[1]) -%]
    Expected a captured vscode-remote://dev-container+<hex>@ssh-remote+<host>/workspaces/<workspace> folder URI (the captured + may be %2B), or leave empty.
    [%- endif -%]

use_antigravity_cli:
  type: bool
  help: >-
    ANTIGRAVITY CLI: Configure Google's account-backed Antigravity CLI for
    prompt-free operation in the devcontainer? Defaults off. Requires one
    interactive Google sign-in (Antigravity has no API-key env var), persisted
    via the ~/.gemini named volume. Google's $0 Individual plan has basic weekly
    limits; paid plans raise them. Google documents no public-vs-private repo
    feature restriction: the CLI operates on the mounted local workspace, so
    review its terms/data handling before using proprietary code. The bot
    profile runs fully autonomous: it trusts its workspace, always proceeds with
    tools/artifacts, allows non-workspace access, disables Antigravity's inner
    terminal sandbox because the container is the isolation boundary, configures
    the statusLine renderer, and a bot-only wrapper injects
    --dangerously-skip-permissions for headless `agy -p` runs (which ignore the
    settings file). The human dev profile gets a BALANCED policy instead:
    auto-accept edits and an allowlist of common commands, but still prompt for
    anything unlisted, keeping the workspace and sandbox boundaries.
  default: no
  when: "[[ devcontainer ]]"
  validator: "[% if use_antigravity_cli and not devcontainer %]Enable DEVCONTAINER before ANTIGRAVITY CLI.[% endif %]"

use_alternative_claude_providers:
  type: bool
  help: >-
    ALT MODELS: Add claude-kimi / claude-deepseek / claude-glm / claude-qwen
    wrapper functions that launch Claude Code against alternative
    Anthropic-compatible model providers (Moonshot Kimi K3, DeepSeek V4, Z.AI
    GLM-5.2, Alibaba Qwen3.7-Max/Qwen3-Coder-Plus)? Each requires an account +
    a PAID per-token API key (KIMI_API_KEY/MOONSHOT_API_KEY, DEEPSEEK_API_KEY,
    ZAI_API_KEY, QWEN_API_KEY) supplied via the devcontainer env-file — there
    is no guaranteed free tier, only limited trial credit that may be offered at
    signup (verify current terms at each provider). DATA-HANDLING: each wrapper
    sends your prompts and code to that third party (Moonshot, DeepSeek, Z.AI,
    or Alibaba), so for private/proprietary repos review each provider's
    data-retention and model-training policy before opting in. A local Qwen
    lane (claude-qwen-local) is also included, targeting your own
    Ollama/LM Studio endpoint — no third party or key involved there. The
    wrappers are inert without keys. Routes the keys into BOTH bot and dev
    env-files: the bot runs bypassPermissions, so a headless agent there can
    read them.
  default: no
  when: "[[ devcontainer ]]"

project_management:
  type: str
  help: "PROJECT MGMT: Add a project-management doc (docs/project-management.md)?"
  choices:
    none: none
    GitHub Projects: github
    Linear (TODO stub): linear
  default: none

git_init:
  type: bool
  help: "GIT INIT: Initialize git repo?"
  default: yes

github_remote_create:
  type: bool
  help: >-
    GITHUB REMOTE: Create the remote repo on GitHub (gh repo create, private,
    pushes initial state)? Note it is created PRIVATE, and GitHub restricts
    draft pull requests on private repositories to its paid plans. The generated
    agent workflow opens every PR as a draft and promotes it only through the
    readiness gate (AGENTS.md), so on a private free-plan repo that lifecycle
    fails at `gh pr create --draft`. Make the repo public, upgrade the plan, or
    plan to drive PRs by hand there — see docs/CHECKLIST.md.
  default: no

github_release_init:
  type: bool
  help: "RELEASE: Create an initial release (task release:init)?"
  default: no

bunch_add:
  type: bool
  help: "BUNCH: Add Bunch file to project (macOS-only, moves file to iCloud)?"
  default: no

# Prompted only when the feature is on, and recorded in .copier-answers.yml so
# `copier update` keeps the answer. The default is one iCloud layout, not
# everyone's: the install task fails on a destination that does not exist, so a
# consumer with a different vault must be able to say so rather than have the
# copier run abort. `~` is expanded at run time by scripts/meta-install.sh.
bunches_directory:
  type: str
  help: "BUNCH: Directory holding your .bunch files (must already exist)"
  default: "~/Library/Mobile Documents/com~apple~CloudDocs/Bunches"
  when: "[[ bunch_add ]]"
  validator: >-
    [% if "'" in bunches_directory or '"' in bunches_directory or ":" in bunches_directory
       or "#" in bunches_directory or "$" in bunches_directory or "`" in bunches_directory
       or "\\" in bunches_directory %]must not contain any of ' " : # $ ` \ —
    the path is rendered into a Taskfile command, where those characters
    break the YAML scalar or the shell quoting around it[% endif %]

obsidian_project_add:
  type: bool
  help: "OBSIDIAN: Add Obsidian project note to the vault (macOS-only)?"
  default: no

obsidian_directory:
  type: str
  help: "OBSIDIAN: Vault directory the project note is filed under (must already exist)"
  default: "~/Local/Memex/Professional"
  when: "[[ obsidian_project_add ]]"
  validator: >-
    [% if "'" in obsidian_directory or '"' in obsidian_directory or ":" in obsidian_directory
       or "#" in obsidian_directory or "$" in obsidian_directory or "`" in obsidian_directory
       or "\\" in obsidian_directory %]must not contain any of ' " : # $ ` \ —
    the path is rendered into a Taskfile command, where those characters
    break the YAML scalar or the shell quoting around it[% endif %]

run_task_install:
  type: bool
  help: "TASK INSTALL: Run 'task install' after generation (brew bundle + git hooks)?"
  default: no

# ── Hidden defaults (when: false) ───────────────────────────────────

organization:
  type: str
  default: "Harmon Lab"
  when: false

organization_url:
  type: str
  default: "https://harmonlab.net"
  when: false

organization_email:
  type: str
  default: "evan@evanharmon.com"
  when: false

repo_url:
  type: str
  default: "https://github.com/[[ github_org ]]/[[ project_slug ]]"
  when: false

# Render-time fallback for `runs-on:` in generated workflows. At runtime the
# CI_RUNS_ON GitHub Actions variable (repo or org level, JSON: '"ubuntu-latest"'
# or '["self-hosted","linux",...]') overrides this without a re-render — so a
# downed self-hosted runner box is a variable flip, not a template update.
ci_runs_on_default:
  type: str
  default: >-
    [% if ci_runner == 'self-hosted' %]
    [[ (ci_runner_labels.split(',') | map('trim') | select | list) | tojson ]]
    [% else %]
    "ubuntu-latest"
    [% endif %]
  when: false

# Gates .github/workflows/claim-release.yml, which releases the claim markers
# an agent session left on an issue once a close event says the work is done.
# Computed rather than asked, because the answer is a CAPABILITY and not a
# preference: the workflow only wires events to release-claim.sh, which ships
# inside the vendored skills, so a repo with no skills sync has nothing for a
# question to offer. Deliberately NOT tied to project_management: the claim
# comment is written whether or not a board exists, and needs its release
# comment either way.
#
# Gates on `use_skills_sync` ALONE, deliberately not on `'universal' in
# skill_categories`, even though `universal` is the category that carries the
# script. Categories are editable after scaffolding — `copier.yml:155` and the
# generated `.skills-sync.yaml` header both say so — and that edit does NOT
# update the recorded answer. A narrower gate would therefore stay false
# forever for a repo that adds `universal` the documented way: the claim skills
# would be vendored and writing `Claiming —` markers while the workflow that
# releases them was never rendered, stranding claims exactly as this workflow
# exists to prevent. The runtime guard inside the workflow makes the looser
# gate safe — with no script AND no claim skill on disk it exits 0 with a
# notice — so the cost is two no-op jobs per close event in a repo that keeps
# the skills sync but drops `universal`, and the benefit is that adding the
# category later just works, with no `copier update` needed at all. See #622
# for the general form of this coupling.
claim_release_available:
  type: bool
  default: "[[ use_skills_sync ]]"
  when: false

use_node:
  type: bool
  default: "[[ project_type in ['web-astro', 'web-app'] ]]"
  when: false

use_python:
  type: bool
  default: "[[ include_ansible or project_type == 'iac' ]]"
  when: false

devcontainer_image:
  type: str
  default: "ghcr.io/[[ github_org ]]/[[ project_slug ]]-devcontainer"
  when: false

# Paths
# Must stay `~`-relative — never an absolute `/Users/<name>/...` — so a generated
# repo never carries a path that only resolves on one machine (issue #552). This
# one is written UNQUOTED into the .bunch `$ open -a ...` line, where Bunch's own
# shell expands it; the prompted Bunch/Obsidian destinations above are expanded
# by scripts/meta-install.sh instead, because they render into single-quoted
# Taskfile commands where the shell will not expand a `~`.
projects_directory:
  type: str
  default: ~/git
  when: false

# Demographics
country:
  type: str
  default: United States
  when: false

state:
  type: str
  default: Kansas
  when: false

# Date & Time
current_date:
  type: str
  default: "[[ '%Y-%m-%d' | strftime ]]"
  when: false

current_year:
  type: str
  default: "[[ '%Y' | strftime ]]"
  when: false

# ── Post-generation tasks ───────────────────────────────────────────
# All side-effectful tasks default to no so `copier copy --defaults` is
# CI-safe (except git_init, which only touches the new project directory).

# First-run-only tasks are gated on `_copier_operation == 'copy'` so they do
# NOT re-run on `copier update` (which would make a spurious scaffold commit,
# re-init git, re-create the remote, re-cut a release, or re-move the macOS meta
# files). `task install` is intentionally left ungated — re-running it on update
# refreshes brew deps + lefthook hooks against any updated config.
_tasks:
  # Both git commands are idempotent so adopting harmon-init INTO an existing
  # repo (`copier copy` over a checkout with its own history) is a safe no-op
  # here: `[ -d .git ]` skips re-init, and the HEAD guard skips the scaffold
  # commit when commits already exist. On a fresh scaffold neither guard fires.
  - command: "[ -d .git ] || git init -b main"
    when: "[[ git_init and _copier_operation == 'copy' ]]"
  # Initial commit — gh repo create --push and task release:init both need
  # HEAD to exist. Runs before `task install`, so lefthook hooks are not yet
  # installed and nothing intercepts this commit. Skipped when HEAD already
  # exists (adopt-over-existing) so it never makes a spurious scaffold commit.
  - command: 'git rev-parse --verify HEAD >/dev/null 2>&1 || { git add -A && git commit -m "chore: initial scaffold from harmon-init"; }'
    when: "[[ git_init and _copier_operation == 'copy' ]]"
  # The remaining side effects are FRESH-SCAFFOLD ONLY, so they are also gated on
  # `git_init` (the fresh-scaffold signal — adopt-over-existing always passes
  # git_init=false). `copier copy` seeds answer defaults from an EXISTING
  # .copier-answers.yml, so a re-adopt would otherwise carry a stale `true`
  # forward and (e.g.) re-run `gh repo create` or cut a bogus `release:init`
  # v0.1.0 over a repo already on v2/v3. The two externally-visible tasks also
  # carry their own idempotency guard (skip if origin/tags already exist).
  - command: 'git remote get-url origin >/dev/null 2>&1 || gh repo create [[ github_org ]]/[[ project_slug ]] --private --source=. --push'
    when: "[[ git_init and github_remote_create and _copier_operation == 'copy' ]]"
  - command: task install
    when: "[[ run_task_install ]]"
  - command: 'git tag | grep -q . || task release:init'
    when: "[[ git_init and github_release_init and _copier_operation == 'copy' ]]"
  - command: task util:bunch-install
    when: "[[ git_init and bunch_add and _copier_operation == 'copy' ]]"
  - command: task util:obsidian-install
    when: "[[ git_init and obsidian_project_add and _copier_operation == 'copy' ]]"

# ── Copier settings ─────────────────────────────────────────────────

_min_copier_version: "9.4.0"

_subdirectory: template

# Files copier must NEVER merge into on `copier update` — kept deliberately
# minimal. Everything else (README, AGENTS.md, DESIGN.md, docs, …) is left OUT so
# copier's three-way merge keeps delivering template improvements (e.g. a new
# README section) while preserving the repo's own edits; only overlapping edits
# conflict, and the update flow reconciles those. `_skip_if_exists` freezes a
# file entirely, so it is reserved for content owned by another generator or by
# the consumer (their own access decisions):
#   - CHANGELOG.md — release-please owns it; template merges would fight it.
_skip_if_exists:
  - CHANGELOG.md
  # The workspace is generated once with a random peacock color and then tracked
  # by the consumer; freeze it so `copier update` never regenerates a new color
  # (which would churn a now-committed file on every update).
  - "*.code-workspace"
  # CODEOWNERS encodes the repo's real access control (who must review / is
  # auto-requested). The template renders it from the single `code_owner` answer
  # (`* @code_owner`), which can't represent a second owner or a team — so a
  # Path-B adopt over a repo with MORE owners would silently DROP them (a security
  # regression). Freeze it: a fresh scaffold still gets `* @code_owner`; an
  # existing CODEOWNERS is never clobbered on adopt/update.
  - .github/CODEOWNERS
  # related-repos.txt is the repo's curated list of sibling repos to clone/fetch
  # in the devcontainer (the bootstrap/fetch scripts are template-owned and keep
  # updating; only the list is per-repo). Ship an empty stub on first scaffold,
  # then freeze it so `copier update` never overwrites a populated list.
  - .devcontainer/related-repos.txt
  # .release-please-manifest.json is release-please state (the repo's current
  # released version), not template content. The template only seeds it (0.0.0)
  # for a fresh scaffold; every repo that has cut a release carries a real
  # version, so an unfrozen copy conflicts on EVERY `copier update` (seed vs
  # real) and a careless resolution regresses release tracking. Same rationale
  # as CHANGELOG.md above: freeze it — fresh scaffolds still get the seed; an
  # existing manifest is never clobbered.
  - .release-please-manifest.json

# Keep CLAUDE.md/GEMINI.md as symlinks to AGENTS.md in generated projects
# (without this, copier dereferences symlinks into duplicate files).
_preserve_symlinks: true

# Custom jinja delimiters — see header comment. trim/lstrip keep block tags
# on their own lines from leaving blank lines in rendered output.
_envops:
  block_start_string: "[%"
  block_end_string: "%]"
  variable_start_string: "[["
  variable_end_string: "]]"
  comment_start_string: "[#"
  comment_end_string: "#]"
  trim_blocks: true
  lstrip_blocks: true

# Variables containing password/key are excluded from .copier-answers.yml
_secret_questions:
  - password
  - key
