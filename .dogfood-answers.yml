# .dogfood-answers.yml — the copier answers harmon-init's ROOT layer is the
# render of. Consumed by `task audit:dogfood` and `task test:dogfood-structure`
# (scripts/audit-dogfood.sh, scripts/test-dogfood-structure.sh).
#
# This is NOT a .copier-answers.yml: harmon-init IS the template, so it has no
# copier operation of its own and `copier update` can never target it. The root
# layer is a HAND-MAINTAINED render of template/, and these are the answers it
# is maintained against. Recording them turns "render the template the way the
# root is supposed to look" from tribal knowledge into one command.
#
# Keep in sync with reality: when the root layer adopts a new template option
# (or drops one), change the answer here in the same PR, or the drift tooling
# reports noise instead of drift. Answers that only fire side effects
# (github_remote_create, run_task_install, ...) are forced off by the scripts,
# not recorded here.
project_name: Harmon Init
project_slug: harmon-init
project_description: >-
  Copier project template that scaffolds repos with pre-configured DevOps
  tooling, CI/CD, linting, security checks, git hooks, and task runners
project_type: general

github_org: evanharmon1
code_owner: evanharmon1
claude_authorized_members: evanharmon1

license: mit
ci_runner: ubuntu-latest

# Releases are intentional via release-please; `template/` is the release-worthy
# path, so a PR touching it must carry a fix:/feat: title (release-content-guard).
use_release_please: true
release_content_paths: template

# Vendors the `repo` category (the standardize-repo skill) from harmon-devkit.
use_skills_sync: true
use_shared_agents: true
skill_categories:
  - universal
  - repo

use_foreman: true
foreman_additional_trusted_actors: AdmiralFraggle

# No first-party source language remains (foreman is a pinned external CLI,
# not vendored Python), so CodeQL has nothing to analyze here. The template
# still ships CodeQL for consumers that select a language.
use_codeql: false

# This repo dogfoods local and cloud Codex review; CodeRabbit stays off.
use_codex_review: true
use_codex_cloud_review: true
use_coderabbit: false

devcontainer: true
# Dogfoods the opt-in, read-only GitHub CLI fallback for a missing Claude PR
# payload. Generated projects leave it off unless their maintainer opts in.
use_statusline_pr_lookup: true
# No captured personal URI is checked in: it is extension-owned client state.
# The root therefore renders the general local-clone fallback only.
devcontainer_coder_folder_uri: ""

# Dogfoods prompt-free Antigravity in the bot profile. The generated-template
# default stays off because Antigravity requires a Google account.
use_antigravity_cli: true

# Dogfoods the alternative-model provider wrappers (claude-kimi/deepseek/glm)
# in both devcontainer profiles. Keys come from 1Password Environments locally.
use_alternative_claude_providers: true

# Root ships docs/project-management.md plus setup:github-project / -labels.
project_management: github

# Advisory second opinion on the free security baseline (Semgrep CE + gitleaks
# + dependency audit). Weekly, not daily: the schedule is quota-aware by
# default, and an advisory scan that is never a required check gains nothing
# from running six more times a week. Renders .github/workflows/snyk-scheduled.yml.
snyk_scan_schedule: weekly

# The root's .meta sidecars are installed, and the root Taskfile renders these
# two destinations. They match the copier defaults today; recording them means a
# future default change shows up as drift instead of silently redefining what
# the root layer is supposed to be a render of.
bunches_directory: "~/Library/Mobile Documents/com~apple~CloudDocs/Bunches"
obsidian_directory: "~/Local/Memex/Professional"

include_terraform: false
include_ansible: false
