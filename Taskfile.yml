# Taskfile for harmon-init (Copier template repo)
# https://taskfile.dev
#
# Two layers live in this repo:
#   - Root: tooling for maintaining the template itself (this file).
#   - template/: the Copier template root that becomes generated projects.
# Lint tasks here exclude template/ where jinja-templated files are not valid
# YAML/Markdown; the test:template:* tasks validate the RENDERED output instead.
version: "3"

output:
  group:
    begin: "::group::{{.TASK}}"
    end: "::endgroup::"

includes:
  # Foreman — deterministic supervisor for milestone-driven agent dispatch
  # (task foreman:plan / dispatch / shepherd / watch ...; the CLI is pinned
  # and fetched via uvx in taskfiles/foreman.yml)
  foreman: taskfiles/foreman.yml

vars:
  # renovate: datasource=npm depName=@fission-ai/openspec
  OPENSPEC_VERSION: "1.11.0"

tasks:
  default:
    desc: Interactive task menu (tv)
    cmds:
      - task: menu-tv

  menu:
    desc: Interactive task menu (fzf)
    silent: true
    interactive: true
    cmds:
      - |
        selected=$(task --list-all | fzf --reverse --header-lines=1)
        if [ -n "$selected" ]; then
          task_name=$(echo "$selected" | awk '{sub(/:$/, "", $2); print $2}')
          task "$task_name"
        fi

  menu-tv:
    desc: Interactive task menu (tv)
    silent: true
    interactive: true
    cmds:
      - |
        selected=$(task --list-all | grep -v "task: Available" | grep -v "\* menu:" | tv)
        if [ -n "$selected" ]; then
          task_name=$(echo "$selected" | awk '{sub(/:$/, "", $2); print $2}')
          task "$task_name"
        fi

  # ── CI / Verification Pipelines ────────────────────────────────
  ci:
    # Full local mirror of this repo's CI — run on demand to catch everything CI
    # would (the lint job's guards, the template render matrix, security) without
    # waiting on a PR. The PR-metadata closing guard stays outside offline
    # `verify`, so run it explicitly before building ON `verify` and adding every
    # other check the build workflow runs. verify:skills is the NETWORK drift
    # check (the CI job runs the same one); it is deliberately not in `verify`,
    # which stays offline — pre-push uses verify:skills:offline for that reason.
    # The devcontainer permission assertion is a unit check and does not build or
    # start a container.
    desc: Full CI mirror (guard:closing-keywords → verify → verify:skills → test:devcontainer:permissions → security)
    cmds:
      - task: guard:closing-keywords
      - task: verify
      - task: verify:skills
      - task: test:devcontainer:permissions
      - task: security

  verify:
    # Local gate for this template repo. Like a generated repo's `verify` (the
    # Foreman v2 vocabulary: the definition-of-done gate — check + build +
    # test), it runs check, the quick guards, and its test tier — which here
    # renders the whole template via test:template, so it is inherently heavier.
    desc: Local verification gate (check → guards → test:template)
    cmds:
      - task: check
      - task: audit:agent-instructions
      - task: test:agent-instructions-size
      - task: test:agent-skill-links
      - task: test:agent-registry
      - task: test:registry-drift
      - task: test:registry-docs
      - task: test:label-registry
      - task: test:tasks
      - task: test:ci-results
      - task: test:output
      - task: test:status
      - task: test:gh-scopes
      - task: test:meta-install
      - task: test:copier-validators
      - task: test:renovate-pins
      - task: test:lint-hygiene
      - task: test:release-title
      - task: test:claim-release-merged
      - task: test:setup-github
      - task: test:setup-github-project
      - task: test:sync-devkit-release
      - task: test:devcontainer:image:automation
      - task: test:skills-pin-parity
      - task: test:tag-hygiene
      - task: test:dogfood-parity
      - task: test:dogfood-structure
      - task: test:permission-allowlist
      - task: test:devflow-config
      - task: test:starship-glyphs
      - task: test:template-independence
      - task: test:category-gates
      - task: test:hooks
      - task: test:worktree
      - task: test:session-cleanup
      - task: test:statusline
      - task: test:link-claude-json
      - task: test:image-staleness
      - task: test:open-devcontainer
      - task: test:codex-review
      - task: test:template-helpers
      - task: spec:validate
      - task: test:template

  # ── Quality Checks ────────────────────────────────────────────
  check:
    desc: Run all linters (parallel)
    deps: [lint]

  audit:agent-instructions:
    desc: Warn when AGENTS.md exceeds Codex's default 32 KiB discovery budget
    cmds:
      - ./scripts/check-agent-instructions-size.sh AGENTS.md

  lint:
    desc: Run all linters in parallel
    deps:
      - lint:yaml
      - lint:shell
      - lint:markdown
      - lint:actions
      - lint:hygiene

  lint:yaml:
    desc: yamllint (template/ excluded via .yamllint ignore)
    cmds:
      - yamllint {{.CLI_ARGS | default "."}}

  lint:shell:
    desc: shellcheck + shfmt (template/ excluded — jinja-named paths contain spaces; rendered scripts are checked by test:template)
    cmds:
      - ./scripts/lint-shell.sh {{.CLI_ARGS}}

  lint:markdown:
    # Check-only (no --fix) so this is a read-only gate like lint:prettier /
    # lint:shell: CI and the pre-commit hook fail loudly instead of silently
    # mutating the tree (and, in CI, discarding the fix while reporting green).
    # Auto-fix lives in `task format` / `task format:file`. The bin-vs-npx
    # dispatch + default glob set (template/ excluded — jinja markdown) live in
    # scripts/markdownlint.sh.
    desc: markdownlint-cli2, check mode (template/ excluded — jinja markdown)
    cmds:
      - ./scripts/markdownlint.sh check {{.CLI_ARGS}}

  lint:actions:
    desc: actionlint on GitHub workflows
    env:
      # SC2016 flags '$' in single quotes, but we intentionally single-quote
      # jq expressions that use '$var' placeholders.
      SHELLCHECK_OPTS: --exclude=SC2016
    cmds:
      - actionlint

  lint:hygiene:
    desc: File hygiene (trailing whitespace, EOF newlines, merge markers, etc.)
    cmds:
      - ./scripts/lint-hygiene.sh {{.CLI_ARGS}}

  lint:commit-msg:
    desc: Validate commit message (conventional commits)
    cmds:
      - npx --yes --package @commitlint/cli --package @commitlint/config-conventional -- commitlint --edit {{.CLI_ARGS}}

  lint:commit-msg:text:
    desc: "Validate a commit message read from stdin (usage: printf '%s' <message> | task lint:commit-msg:text)"
    cmds:
      - npx --yes --package @commitlint/cli --package @commitlint/config-conventional -- commitlint

  guard:no-commit-to-main:
    desc: Block direct commits to main
    cmds:
      - |
        branch=$(git rev-parse --abbrev-ref HEAD)
        if [ "$branch" = "main" ]; then
          echo "Direct commits to main are blocked. Use a feature branch."
          exit 1
        fi

  guard:release-title:
    # The CI counterpart of a pre-commit hook — enforced by release-content-guard.yml
    # at PR time because the thing it checks (the PR title, which squash-merge feeds
    # to release-please) does not exist locally. A non-releasing title over
    # release-worthy content would merge without cutting a tag. RELEASE_CONTENT_PATHS
    # is this repo's guarded prefixes; generated repos render it from
    # release_content_paths. Pre-flight before opening a PR with an intended title:
    #   PR_TITLE="<title>" BASE_SHA=main task guard:release-title
    # (CI passes PR_TITLE/PR_BODY + BASE_SHA/HEAD_SHA; CHANGED_FILES overrides the diff.)
    desc: "Guard: a PR touching release-worthy paths needs a fix:/feat: title"
    vars:
      RELEASE_CONTENT_PATHS: template
    cmds:
      - ./scripts/require-release-title.sh {{.RELEASE_CONTENT_PATHS}}

  guard:closing-keywords:
    # CI supplies PR metadata. Local runs fetch an open PR from the current
    # branch when either value is absent; before a PR exists, a successful empty
    # listing supplies empty title/body while API failures remain indeterminate.
    # Commit messages are read as data, never executed.
    desc: "Guard: same-repo closing keywords require a completed issue checklist"
    cmds:
      - |
        commits_file=$(mktemp)
        trap 'rm -f "$commits_file"' EXIT
        base_sha="${BASE_SHA:-origin/main}"
        head_sha="${HEAD_SHA:-HEAD}"
        if ! merge_base="$(git merge-base "$base_sha" "$head_sha")" || [ -z "$merge_base" ]; then
          echo "guard:closing-keywords: could not resolve merge-base for ${base_sha} and ${head_sha}; refusing to scan an indeterminate commit range" >&2
          exit 2
        fi
        if ! commit_count="$(git rev-list --count "${merge_base}..${head_sha}")"; then
          echo "guard:closing-keywords: could not count commits in ${merge_base}..${head_sha}; refusing an indeterminate range" >&2
          exit 2
        fi
        if [ "$commit_count" -gt 250 ]; then
          echo "guard:closing-keywords: PR range has ${commit_count} commits, exceeding the workflow's 250-commit API limit" >&2
          exit 1
        fi
        git log --format=%B "${merge_base}..${head_sha}" > "$commits_file"
        if [ -z "${PR_TITLE+x}" ] || [ -z "${PR_BODY+x}" ]; then
          branch="$(git branch --show-current)"
          if [ -z "$branch" ] || ! pr_json="$(gh pr list --head "$branch" --state open --limit 2 --json title,body)"; then
            echo "guard:closing-keywords: could not list PR metadata for the current branch; supply both PR_TITLE and PR_BODY" >&2
            exit 2
          fi
          pr_count="$(printf '%s' "$pr_json" | jq 'length')"
          if [ "$pr_count" -gt 1 ]; then
            echo "guard:closing-keywords: multiple open PRs match branch ${branch}; supply both PR_TITLE and PR_BODY" >&2
            exit 2
          elif [ "$pr_count" -eq 1 ]; then
            PR_TITLE="$(printf '%s' "$pr_json" | jq -r '.[0].title')"
            PR_BODY="$(printf '%s' "$pr_json" | jq -r '.[0].body // ""')"
          else
            echo "guard:closing-keywords: no open PR for ${branch}; checking commits with inert pre-PR metadata" >&2
            PR_TITLE="Pre-PR local CI"
            PR_BODY="No pull request body exists yet."
          fi
          export PR_TITLE PR_BODY
        fi
        repo="${GH_REPO:-}"
        if [ -z "$repo" ]; then
          repo="$(gh repo view --json nameWithOwner --jq .nameWithOwner)"
        fi
        PR_TITLE="$PR_TITLE" PR_BODY="$PR_BODY" ./scripts/check-closing-keywords.sh --repo "$repo" \
          --title-env PR_TITLE --body-env PR_BODY --commits-file "$commits_file"

  format:
    desc: Auto-format code
    cmds:
      - ./scripts/format-shell.sh
      # Best-effort markdown auto-fix (bin-vs-npx dispatch + default globs in the
      # helper; template/ excluded — jinja markdown); must NOT abort `format` on
      # un-auto-fixable rule violations — `lint:markdown` (check-only) is the gate.
      - ./scripts/markdownlint.sh fix

  format:file:
    desc: "Format a single file by extension (usage: task format:file -- <path>)"
    cmds:
      - |
        f={{.CLI_ARGS}}
        [ -z "$f" ] && exit 0
        [ -f "$f" ] || exit 0
        case "$f" in
        *.sh | *.bash) shfmt -w "$f" ;;
        *.md | *.mdx) ./scripts/markdownlint.sh fix "$f" ;;
        esac

  fix:
    desc: Format then lint
    cmds:
      - task: format
      - task: lint

  # ── Template Tests ────────────────────────────────────────────
  # Copier renders the LATEST TAG unless --vcs-ref=HEAD is passed, and with
  # --vcs-ref=HEAD it auto-includes dirty/untracked changes (DirtyLocalWarning)
  # via a throwaway commit in a temp clone — your working tree is never touched.
  test:
    desc: Run all template generation tests
    cmds:
      - task: test:template

  test:template:
    desc: Generate projects from the template (all profiles) and validate them
    cmds:
      - task: test:template:all

  test:template:all:
    desc: All template test profiles (parallel)
    deps:
      - test:template:minimal
      - test:template:web
      - test:template:webapp
      - test:template:iac
      - test:template:full
      - test:template:meta
      - test:template:update

  test:template:minimal:
    desc: Render template with default answers and validate the result
    cmds:
      - ./scripts/test-template.sh minimal

  test:template:web:
    desc: Render template as project_type=web-astro and validate
    cmds:
      - ./scripts/test-template.sh web

  test:template:webapp:
    desc: Render template as project_type=web-app and validate
    cmds:
      - ./scripts/test-template.sh webapp

  test:template:iac:
    desc: Render template as project_type=iac (terraform+ansible) and validate
    cmds:
      - ./scripts/test-template.sh iac

  test:template:full:
    desc: Render template with maximum conditional coverage and validate
    cmds:
      - ./scripts/test-template.sh full

  test:template:meta:
    desc: Render template with bunch/obsidian/private-license branches (--skip-tasks) and validate
    cmds:
      - ./scripts/test-template.sh meta

  test:template:update:
    desc: Verify `copier update` is safe (delivers template changes; repo edits + seeds survive; no churn)
    cmds:
      - ./scripts/test-template-update.sh

  test:template:committed:
    desc: Render template, failing if the working tree is dirty (pre-release gate)
    cmds:
      - |
        if [ -n "$(git status --porcelain)" ]; then
          echo "FAIL: working tree is dirty — commit changes before the release gate." >&2
          exit 1
        fi
      - task: test:template:all

  test:devcontainer:root:
    desc: Smoke test the primary (AI bot) devcontainer via the devcontainers CLI
    cmds:
      - ./scripts/devcontainer-smoke.sh .devcontainer/devcontainer.json

  test:devcontainer:dev:
    desc: Smoke test the dev (human) devcontainer via the devcontainers CLI
    cmds:
      - ./scripts/devcontainer-smoke.sh .devcontainer/dev/devcontainer.json

  test:devcontainer:permissions:
    desc: Unit-assert devcontainer permission invariants (no container needed)
    cmds:
      - ./scripts/devcontainer-assert.sh unit

  test:statusline:
    desc: Unit-test the devcontainer status line renderer (no container needed)
    cmds:
      - ./scripts/test-statusline.sh

  test:link-claude-json:
    desc: Unit-test the ~/.claude.json persistence helper (no container needed)
    cmds:
      - ./scripts/test-link-claude-json.sh

  test:image-staleness:
    desc: Unit-test the image-staleness warning (no container needed)
    cmds:
      - ./scripts/test-image-staleness.sh

  test:open-devcontainer:
    desc: Unit-test the client-side dev container launcher (no VS Code needed)
    cmds:
      - ./scripts/test-open-devcontainer.sh

  test:devcontainer:image:
    desc: Build and smoke-test the canonical shared image and current repository overlay
    cmds:
      - ./scripts/test-devcontainer-image.sh {{.CLI_ARGS}}

  test:devcontainer:image:automation:
    desc: Unit-test shared-image manifest/publish/pin automation (offline, stubbed boundaries)
    cmds:
      - ./scripts/test-devcontainer-image-automation.sh

  test:hooks:
    desc: Round-trip the Taskfile targets the Claude hooks delegate to
    cmds:
      - ./scripts/test-hooks.sh

  test:worktree:
    desc: Behavioral test for worktree:new / worktree:rm (create → verify hooks → remove, in a throwaway fixture repo)
    cmds:
      - ./scripts/test-worktree.sh

  test:session-cleanup:
    desc: Behavioral test for audit:session-artifacts / clean:branches / clean:worktree-records (evidence-gated deletion + negative controls, in a throwaway fixture repo)
    cmds:
      - ./scripts/test-session-cleanup.sh

  test:agent-instructions-size:
    desc: Unit-test the non-blocking AGENTS.md size advisory
    cmds:
      - ./scripts/test-agent-instructions-size.sh

  test:agent-registry:
    desc: Schema-check the machine-readable agent registry and its cross-record invariants
    cmds:
      - ./scripts/test-agent-registry.sh

  test:registry-drift:
    desc: Bind label provisioning, provider wrappers, and Foreman adapters to the agent registry (offline drift gate)
    cmds:
      - ./scripts/test-registry-drift.sh

  test:registry-docs:
    # No COPIER_ANSWERS_FILE here: harmon-init is the template, so it has no
    # copier operation and no answers file of its own. That absence, plus the
    # project-management jinja twins it ships, is exactly how the script knows
    # to check BOTH layers (the generated Taskfile sets the variable; see its
    # twin).
    desc: Bind the published family/harness tables in docs/project-management.md to the agent registry
    cmds:
      - ./scripts/test-registry-docs.sh

  test:label-registry:
    desc: Bind label provisioning, the docs taxonomy table, and the status inventory to the label registry
    cmds:
      - ./scripts/test-label-registry.sh

  test:tasks:
    desc: Guard the Taskfile itself (compiles; setup tasks are safe no-ops)
    cmds:
      - ./scripts/test-tasks.sh

  test:ci-results:
    desc: Unit-test CI aggregate and closing-keyword fail-closed truth tables
    cmds:
      - ./scripts/test-ci-results.sh

  test:output:
    desc: Unit-test shared color/Unicode fallbacks and spinner cleanup
    cmds:
      - ./scripts/test-output.sh

  test:devflow-config:
    desc: Validate the rigor/strategy execution-policy config in .devflow.toml (both copies) + the reference resolver
    cmds:
      - ./scripts/test-devflow-config.sh
      - ./scripts/test-devflow-config-mutations.sh

  test:status:
    desc: Unit-test the status board-writes + local-credential checks (stubbed CLIs, no network)
    cmds:
      - ./scripts/test-status.sh

  test:gh-scopes:
    desc: Unit-test the gh scope refresh task's refusals and post-refresh verification (stubbed gh, no network)
    cmds:
      - ./scripts/test-setup-gh-scopes.sh

  test:meta-install:
    desc: Unit-test the .meta sidecar installer's ~-expansion and refusals
    cmds:
      - ./scripts/test-meta-install.sh

  test:copier-validators:
    desc: Guard the answer validators that keep unsafe characters out of rendered paths
    cmds:
      - ./scripts/test-copier-validators.sh

  test:renovate-pins:
    desc: Check every annotated shell version pin is extractable by Renovate
    cmds:
      - ./scripts/test-renovate-pins.sh

  test:lint-hygiene:
    desc: Behavioral fixtures for lint-hygiene's trigger-phrase adjacency scan
    cmds:
      - ./scripts/test-lint-hygiene.sh

  test:release-title:
    desc: Unit-test the release-content title guard (require-release-title.sh)
    cmds:
      - ./scripts/test-release-title.sh

  test:claim-release-merged:
    desc: Unit-test merged-PR claim release (offline, stubbed gh and release engine)
    cmds:
      - ./scripts/test-claim-release-merged.sh

  test:setup-github:
    desc: Unit-test repository-setting outcomes and failure propagation (stubbed gh, no network)
    cmds:
      - ./scripts/test-setup-github.sh

  test:setup-github-project:
    desc: Unit-test the GitHub Project field reconciliation (stubbed gh, no network)
    cmds:
      - ./scripts/test-setup-github-project.sh

  test:sync-devkit-release:
    desc: Unit-test the harmon-devkit release→sync-PR automation (offline, stubbed gh/task)
    cmds:
      - ./scripts/test-sync-devkit-release.sh

  sync:devcontainer-image:prepare:
    desc: Prepare and verify a rolling shared-image consumer pin without write credentials
    requires:
      vars: [SOURCE_SHA, MANIFEST_DIGEST]
    cmds:
      - ./scripts/sync-devcontainer-image.sh prepare "{{.SOURCE_SHA}}" "{{.MANIFEST_DIGEST}}"

  sync:devcontainer-image:publish:
    desc: Publish an already-prepared shared-image consumer pin branch and PR
    requires:
      vars: [SOURCE_SHA, MANIFEST_DIGEST]
    cmds:
      - ./scripts/sync-devcontainer-image.sh publish "{{.SOURCE_SHA}}" "{{.MANIFEST_DIGEST}}"

  # ROOT-ONLY: a generated repo has ONE skills-sync manifest, so it has nothing
  # to compare). Closes a real hole: `verify:skills*` both read only the ROOT
  # manifest, so a pin edited in the template twin alone leaves the root pin and
  # the provenance agreeing, passes every other gate, and ships a stale pin to
  # generated repos — surfacing only when the next automated sync aborts. The
  # comparison already exists as sync-devkit-release.sh's `pinned` (offline: no
  # gh, no network); this just runs it as a gate.
  test:skills-pin-parity:
    desc: "Guard: the root and template skills-sync manifests pin the same harmon-devkit tag"
    cmds:
      - ./scripts/sync-devkit-release.sh pinned

  # Root-only on purpose: only a repo that copier-renders ITSELF derives a
  # template version from `git describe`, so only this repo can be broken by a
  # non-release tag on the commit git describe selects (issue #598).
  test:tag-hygiene:
    desc: "Guard: no non-release tag sits where git describe would select it"
    cmds:
      - ./scripts/test-tag-hygiene.sh

  # ── Dogfood drift (root layer vs template/) ───────────────────
  # Three checks, in increasing looseness. The root layer is template/ rendered
  # with .dogfood-answers.yml, maintained by hand — `copier update` can never
  # target it, because harmon-init IS the template.
  test:dogfood-parity:
    desc: Verbatim (non-jinja) template files must byte-match their root twins
    cmds:
      - ./scripts/test-dogfood-parity.sh

  test:dogfood-structure:
    desc: Every section/task the rendered template ships must exist in the root layer
    cmds:
      - ./scripts/test-dogfood-structure.sh

  test:permission-allowlist:
    desc: "Guard: narrowed/dropped Claude Code Bash grants stay narrowed, allow arrays match across the dogfood twins"
    cmds:
      - ./scripts/test-permission-allowlist.sh

  # Root-only on purpose: the powerline glyphs are harmon-init's own theme
  # choice, not an invariant to impose on generated repos (see the script).
  test:starship-glyphs:
    desc: harmon-init's own starship configs must retain their Nerd Font separators
    cmds:
      - ./scripts/test-starship-glyphs.sh

  # Root-only: test-template.sh is the harness that renders the template, so it
  # has no template/ twin and the helpers under test ship to nobody.
  test:template-helpers:
    desc: Unit-test test-template.sh's quiet-command capture helpers (offline; guards the rendered-repo gates against becoming silent no-ops)
    cmds:
      - ./scripts/test-template-helpers.sh

  # Root-only: a generated repo has no template/ to scan. Makes the Hard Rule in
  # AGENTS.md enforceable — the maintainer's personal dotfiles repo is not
  # readable by a consumer, so shipped output must never name it or chezmoi.
  test:template-independence:
    desc: "Guard: consumer-facing output names neither harmon-dotfiles nor chezmoi"
    cmds:
      - ./scripts/test-template-independence.sh

  test:category-gates:
    desc: "Guard: no template file renders conditionally on skill_categories (drifts; #622)"
    cmds:
      - ./scripts/test-category-gates.sh

  audit:dogfood:
    desc: "Report root<->template drift for jinja twins (report, not a gate; --summary for names only)"
    cmds:
      - ./scripts/audit-dogfood.sh {{.CLI_ARGS}}

  test:codex-review:
    desc: Unit-test codex-review.sh target selection (offline, stubbed codex)
    cmds:
      - ./scripts/test-codex-review.sh

  # ── Skills sync ────────────────────────────────────────────────
  # Vendor shared agent skills from harmon-devkit, pinned in .skills-sync.yaml.
  # The verify:skills* drift checks skip cleanly until the first `task sync:skills`,
  # so a fresh scaffold stays green. See docs/CHECKLIST.md.
  sync:skills:
    desc: Vendor the pinned skill categories from harmon-devkit into .claude/skills
    cmds:
      - ./scripts/sync-skills.sh sync
      - ./scripts/link-agent-skills.sh sync

  skills:status:
    desc: "Report the vendoring state (network unless --offline)"
    cmds:
      - ./scripts/sync-skills.sh status {{.CLI_ARGS}}

  verify:skills:
    desc: "Skill drift check (network): fail if vendored skills differ from the pinned ref"
    cmds:
      - ./scripts/link-agent-skills.sh verify
      - ./scripts/sync-skills.sh verify

  verify:skills:offline:
    desc: "Fast offline check that the vendored ref matches the manifest (no network)"
    cmds:
      - ./scripts/link-agent-skills.sh verify
      - ./scripts/sync-skills.sh verify-offline

  test:agent-skill-links:
    desc: Unit-test migration-safe Claude-to-.agents skill compatibility links
    cmds:
      - ./scripts/test-agent-skill-links.sh

  # ROOT VARIANT (the template ships a simpler twin for generated repos): the
  # harmon-init <-> harmon-devkit release edge, driven by the root workflow
  # (dispatch + schedule) with twin-manifest verification.
  # Driven by .github/workflows/sync-harmon-devkit.yml on a harmon-devkit release
  # dispatch, a manual dispatch, or the daily reconciliation schedule — see
  # docs/architecture/ci-cd.md. Opens/updates ONE PR and never merges anything.
  sync:devkit-release:
    desc: "Pin the latest harmon-devkit release, vendor it, verify, and open/update the sync PR"
    cmds:
      - ./scripts/sync-devkit-release.sh run {{.CLI_ARGS}}

  # ── Second-model review (Codex) ───────────────────────────────
  # Optional second AI model (the OpenAI Codex CLI) reviewing the current
  # change — local and advisory only, never part of verify/ci. Findings are
  # hypotheses for the primary agent to adjudicate (AGENTS.md "Second-Model
  # Review"). The codex:gate:* tasks toggle the Claude Code codex plugin's
  # automatic stop-time review for this repo + machine. See
  # docs/guides/codex-review.md for setup, mechanics, and the loop caps.
  review:
    desc: Second-model verification review of the current change (Codex)
    cmds:
      - task: review:codex

  challenge:
    desc: Second-model adversarial review of the current change (Codex)
    cmds:
      - task: challenge:codex

  review:codex:
    desc: "Codex verification review (usage: task review:codex -- [--base <ref>|--uncommitted] [focus text])"
    cmds:
      - ./scripts/codex-review.sh review {{.CLI_ARGS}}

  challenge:codex:
    desc: "Codex adversarial review (usage: task challenge:codex -- [--base <ref>|--uncommitted] [focus text])"
    cmds:
      - ./scripts/codex-review.sh challenge {{.CLI_ARGS}}

  codex:gate:enable:
    desc: Enable the automatic Claude → Codex stop-gate review (this repo, this machine)
    cmds:
      - ./scripts/codex-gate.sh enable

  codex:gate:disable:
    desc: Disable the automatic Claude → Codex stop-gate review
    cmds:
      - ./scripts/codex-gate.sh disable

  codex:gate:status:
    desc: Show whether the Claude → Codex stop-gate review is enabled
    cmds:
      - ./scripts/codex-gate.sh status

  # ── Spec-driven changes (OpenSpec) ──────────────────────────────
  # Root-only: openspec/ is this repo's own change-proposal workflow, never
  # shipped to generated repos (no copier answer, nothing under template/).
  # The CLI is pinned via OPENSPEC_VERSION above and fetched through npx —
  # there is no root package.json to install it into.
  spec:validate:
    # Offline-safe: scripts/spec-validate.sh skips the CLI entirely when there
    # is nothing to validate; openspec.sh separately prefers the user-local
    # install `task spec:install` puts on PATH, so this needs no network in
    # the devcontainer even once real changes/specs exist.
    desc: "Validate every OpenSpec change proposal and spec (openspec validate --all)"
    env:
      OPENSPEC_VERSION: "{{.OPENSPEC_VERSION}}"
    cmds:
      - ./scripts/spec-validate.sh

  spec:list:
    desc: List active OpenSpec change proposals
    env:
      OPENSPEC_VERSION: "{{.OPENSPEC_VERSION}}"
    cmds:
      - ./scripts/openspec.sh list

  spec:update:
    desc: Refresh generated OpenSpec instruction files for configured tools
    env:
      OPENSPEC_VERSION: "{{.OPENSPEC_VERSION}}"
    cmds:
      - ./scripts/openspec.sh update

  spec:run:
    desc: "Run an arbitrary OpenSpec CLI command (usage: task spec:run -- <args>)"
    env:
      OPENSPEC_VERSION: "{{.OPENSPEC_VERSION}}"
    cmds:
      - ./scripts/openspec.sh {{.CLI_ARGS}}

  spec:install:
    # Devcontainer bootstrap only (called from the ROOT post-create.sh /
    # dev/post-create.sh — no template twin, since generated repos don't get
    # OpenSpec). Puts the pinned CLI on PATH so the generated /opsx:* skills'
    # bare `openspec` invocations resolve; task spec:* still use npx and never
    # need this.
    desc: "Install the pinned OpenSpec CLI onto PATH (npm install -g --prefix ~/.local)"
    cmds:
      - ./scripts/install-openspec.sh {{.OPENSPEC_VERSION}}

  # ── Security ──────────────────────────────────────────────────
  security:
    desc: Run all free local security checks (Semgrep CE + gitleaks + dependency audit)
    deps:
      - security:sast
      - security:secrets
      - security:audit

  security:secrets:
    desc: Scan for leaked secrets (gitleaks)
    cmds:
      - ./scripts/gitleaks-scan.sh

  security:audit:
    desc: Dependency audit
    cmds:
      - echo "No package manifests to audit yet."

  security:sast:
    desc: Static application security testing (Semgrep Community Edition)
    cmds:
      - ./scripts/run-semgrep.sh --exclude=.foreman --exclude=template {{.CLI_ARGS}}

  security:sca:
    desc: Software composition analysis (free package-manager audit)
    deps:
      - security:audit

  security:sast:snyk:
    desc: "Optional Snyk Code second-opinion scan (manual/local or explicitly scheduled); needs SNYK_TOKEN"
    cmds:
      - snyk code test --exclude=.worktrees,.foreman,.claude,template --severity-threshold=high {{.CLI_ARGS}}

  security:sca:snyk:
    desc: "Optional Snyk Open Source second-opinion scan (manual/local or explicitly scheduled); needs SNYK_TOKEN"
    cmds:
      - snyk test --all-projects --exclude=.worktrees,.foreman,.claude,template --severity-threshold=high --show-vulnerable-paths=all {{.CLI_ARGS}}

  # ── Secrets ────────────────────────────────────────────────────
  # Destination-only helpers: the secret value stays on stdin — never in argv,
  # env vars, Taskfile vars, or shell history (see docs/conventions.md).
  secret:set:1p:
    desc: "Set an existing 1Password field from stdin (usage: command | task secret:set:1p VAULT=... ITEM=... FIELD=... [SECTION=...])"
    env:
      VAULT: '{{.VAULT | default ""}}'
      ITEM: '{{.ITEM | default ""}}'
      FIELD: '{{.FIELD | default ""}}'
      SECTION: '{{.SECTION | default ""}}'
    cmds:
      - ./scripts/secret-set-1p.sh

  secret:set:gh:
    desc: "Set a GitHub repo secret from stdin (usage: command | task secret:set:gh NAME=... REPO=owner/repo)"
    env:
      NAME: '{{.NAME | default ""}}'
      REPO: '{{.REPO | default ""}}'
    cmds:
      - ./scripts/secret-set-gh.sh

  # ── Setup ─────────────────────────────────────────────────────
  bootstrap:
    desc: One-time machine setup (Homebrew)
    cmds:
      # Idempotent: skip the installer when Homebrew is already present. The
      # official installer's NONINTERACTIVE mode demands sudo up front and aborts
      # even when there is nothing to install, so guard on `brew` existing.
      - command -v brew >/dev/null 2>&1 || NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"

  install:
    desc: Install all project dependencies and tools
    cmds:
      # Brewfile deps, but a graceful no-op when Homebrew is absent (this repo's
      # own devcontainer bakes its toolchain into the image and ships no brew).
      - ./scripts/install-brewfile.sh
      # copier (the template engine) is maintenance-only tooling for harmon-init
      # itself. On a Homebrew host it comes from the Brewfile above; this script
      # covers the brew-less devcontainer by installing it via uv. Root-only:
      # generated repos don't render templates, so copier is absent from
      # template/Taskfile.yml.jinja and template/Brewfile.jinja.
      - ./scripts/install-copier.sh
      - task: install:hooks

  install:hooks:
    desc: Install git hooks via lefthook
    cmds:
      - lefthook install

  setup:github:
    desc: Apply idempotent GitHub repo settings via gh (Dependabot alerts, private vulnerability reporting, Actions runner routing)
    vars:
      REPO: "evanharmon1/harmon-init"
    cmds:
      - >-
        ./scripts/setup-github.sh --repo "{{.REPO}}" --ci-runs-on '"ubuntu-latest"'
  setup:github-project:
    desc: Idempotently create/sync the owner's GitHub Project V2 board + Status pipeline (on a personal account also its metadata fields). Requires the Projects scopes — `task setup:gh-scopes`.
    cmds:
      - ./scripts/setup-github-project.sh --owner "evanharmon1" --title "evanharmon1 Project"

  setup:gh-scopes:
    desc: >-
      OPERATOR / DEV PROFILE ONLY: refresh your interactive gh login so it
      carries every scope this repo needs (refuses against a GH_TOKEN env
      credential and without a TTY; verifies the grant landed). Bot containers
      must reissue GH_TOKEN instead.
    # Load-bearing, not cosmetic. This Taskfile sets `output: group` globally,
    # which pipes every task's stdout — so the script's own `[ -t 1 ]` guard saw
    # a pipe and refused with "no TTY" even in a real terminal, making the
    # documented entry point impossible to use. `interactive: true` tells Task
    # to skip output grouping and attach the task to the terminal, which is what
    # both the guard and the browser device-code flow it protects require.
    interactive: true
    cmds:
      - ./scripts/setup-gh-scopes.sh

  setup:github-labels:
    desc: Idempotently create/update this repo's starter labels (see docs/project-management.md). Requires `gh` with repo write.
    vars:
      REPO: "evanharmon1/harmon-init"
    cmds:
      - ./scripts/setup-github-labels.sh --repo "{{.REPO}}" --foreman --release-please

  # ── Release ───────────────────────────────────────────────────
  # Releases are intentional — never automated on merge to main.
  release:init:
    desc: Create initial v0.1.0 tag
    cmds:
      - git tag -a v0.1.0 -m "Initial release"
      - git push origin v0.1.0
      - gh release create v0.1.0 --generate-notes --title "v0.1.0"

  release:patch:
    desc: Bump patch version and release
    vars:
      CURRENT_TAG:
        sh: git describe --tags --abbrev=0 --exclude="*-probe*" 2>/dev/null || echo "v0.0.0"
      NEXT_TAG:
        sh: echo "{{.CURRENT_TAG}}" | awk -F. '{printf "%s.%s.%d", $1, $2, $3+1}'
    cmds:
      - echo "Releasing {{.NEXT_TAG}} (was {{.CURRENT_TAG}})"
      - git tag -a {{.NEXT_TAG}} -m "Release {{.NEXT_TAG}}"
      - git push origin {{.NEXT_TAG}}
      - gh release create {{.NEXT_TAG}} --generate-notes --title "{{.NEXT_TAG}}"

  release:minor:
    desc: Bump minor version and release
    vars:
      CURRENT_TAG:
        sh: git describe --tags --abbrev=0 --exclude="*-probe*" 2>/dev/null || echo "v0.0.0"
      NEXT_TAG:
        sh: echo "{{.CURRENT_TAG}}" | awk -F. '{printf "%s.%d.0", $1, $2+1}'
    cmds:
      - echo "Releasing {{.NEXT_TAG}} (was {{.CURRENT_TAG}})"
      - git tag -a {{.NEXT_TAG}} -m "Release {{.NEXT_TAG}}"
      - git push origin {{.NEXT_TAG}}
      - gh release create {{.NEXT_TAG}} --generate-notes --title "{{.NEXT_TAG}}"

  release:major:
    desc: Bump major version and release
    vars:
      CURRENT_TAG:
        sh: git describe --tags --abbrev=0 --exclude="*-probe*" 2>/dev/null || echo "v0.0.0"
      NEXT_TAG:
        sh: echo "{{.CURRENT_TAG}}" | awk -F. '{printf "v%d.0.0", substr($1,2)+1}'
    cmds:
      - echo "Releasing {{.NEXT_TAG}} (was {{.CURRENT_TAG}})"
      - git tag -a {{.NEXT_TAG}} -m "Release {{.NEXT_TAG}}"
      - git push origin {{.NEXT_TAG}}
      - gh release create {{.NEXT_TAG}} --generate-notes --title "{{.NEXT_TAG}}"

  release:check-coverage:
    desc: "Detect feat/fix commits a tag ships that its changelog section omits (swallowed entries from a release-please merge race)"
    vars:
      TAG: '{{default "" .CLI_ARGS}}'
    env:
      TAG: '{{.TAG}}'
    cmds:
      - ./scripts/check-changelog-coverage.sh "$TAG"

  # ── Worktrees ─────────────────────────────────────────────────
  # One blessed entrypoint for parallel/isolated work, so anything that calls it
  # (a second Claude session, herdr, agent-deck, workmux, a human) gets the same
  # ready tree instead of rediscovering the setup and the breakers.
  # See docs/conventions.md § Worktrees.
  #
  # Foreman is NOT routed through this task: it creates worktrees itself, in the
  # pinned upstream CLI, and nothing here redirects that. Its own provisioning
  # is upstream's to fix (issue #757 puts it out of scope) — this entrypoint
  # only makes sure the two agree on `.worktrees/` as the location.
  worktree:new:
    desc: "Create a ready linked worktree (usage: task worktree:new -- <name> [--branch b] [--base ref] [--no-install])"
    cmds:
      - ./scripts/worktree-new.sh {{.CLI_ARGS}}

  worktree:rm:
    desc: "Remove a linked worktree and prune its gitlink debris (usage: task worktree:rm -- <name> [--force])"
    cmds:
      - ./scripts/worktree-rm.sh {{.CLI_ARGS}}

  # ── Clean ─────────────────────────────────────────────────────
  clean:
    desc: Remove build artifacts and caches
    cmds:
      - rm -rf .task

  # ── Session cleanup (#838) ────────────────────────────────────
  # audit:* reports, clean:* acts — and deletion only ever runs on positive
  # evidence (a PR merged into the default branch at exactly the local tip,
  # or verified-fresh ancestry into the remote default), because squash-merge
  # makes ancestry blind to delivered branches. Every deletion is a guarded
  # compare-and-delete against the verified tip. Dry run by default; never a
  # force flag; never touches a worktree or a remote branch.
  audit:session-artifacts:
    desc: "Report session leftovers (unpushed branches, gone upstreams vs merged PRs, other worktrees, review sidecars) — mutates nothing"
    cmds:
      - ./scripts/audit-session-artifacts.sh

  clean:branches:
    desc: "Delete local branches only on positive merge evidence (dry run; 'task clean:branches -- --delete' to act)"
    cmds:
      - ./scripts/clean-branches.sh {{.CLI_ARGS}}

  clean:remote-refs:
    desc: Prune remote-tracking refs whose remote branch is gone, on every remote (git fetch --all --prune)
    cmds:
      - git fetch --all --prune

  clean:worktree-records:
    desc: Prune stale worktree admin records only — pins a detached commit before its record goes (human settles the pin); never removes a worktree directory
    cmds:
      - ./scripts/clean-worktree-records.sh

  # ── Status ────────────────────────────────────────────────────
  status:
    desc: Project status dashboard
    interactive: true
    cmds:
      - ./scripts/status.sh

  status:git:
    desc: Git status section
    interactive: true
    cmds:
      - ./scripts/status.sh git

  status:gh:
    desc: GitHub status section
    interactive: true
    cmds:
      - ./scripts/status.sh gh

  status:creds:
    desc: Credential section (gh, Codex, Claude Code logins + gh token scopes — local probes plus one bounded scope check; STATUS_NO_NETWORK=1 skips it)
    interactive: true
    cmds:
      - ./scripts/status.sh creds

  status:code:
    desc: Codebase stats section
    interactive: true
    cmds:
      - ./scripts/status.sh code

  status:env:
    desc: Environment info section
    interactive: true
    cmds:
      - ./scripts/status.sh env

  status:image:
    desc: Warn if the container's image-baked config has drifted from the checkout (silent when fresh)
    cmds:
      - bash .devcontainer/scripts/check-image-staleness.sh

  status:setup:
    desc: Setup completeness audit (GitHub, toolchain, devcontainer, dev env)
    interactive: true
    cmds:
      - ./scripts/status.sh setup

  # ── Utilities ─────────────────────────────────────────────────
  util:bunch-add:
    desc: Scaffold the Bunch launcher in .meta (mirrors what the template generates)
    cmds:
      - ./scripts/meta-create.sh bunch 'Harmon Init' 'harmon-init' '~/git'

  util:bunch-install:
    desc: Move the Bunch file to iCloud and replace it with a symlink (macOS)
    cmds:
      - ./scripts/meta-install.sh bunch 'Harmon Init' '~/Library/Mobile Documents/com~apple~CloudDocs/Bunches'

  util:obsidian-add:
    desc: Scaffold the Obsidian project note in .meta (mirrors what the template generates)
    cmds:
      - ./scripts/meta-create.sh obsidian 'Harmon Init' 'Evan Harmon'

  util:obsidian-install:
    desc: Move the Obsidian note to the vault and replace it with a symlink (macOS)
    cmds:
      - ./scripts/meta-install.sh obsidian 'Harmon Init' '~/Local/Memex/Professional'
