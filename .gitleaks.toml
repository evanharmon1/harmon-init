# Gitleaks configuration for harmon-init
# https://github.com/gitleaks/gitleaks

[extend]
useDefault = true

[allowlist]
paths = [
    '''node_modules/''',
    '''\.git/''',
    '''\.task/''',
    '''\.worktrees/''',
    '''\.foreman/''',
    # BMad installer content-hash manifest.
    '''_bmad/_config/files-manifest\.csv''',
]
